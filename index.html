/* ============================================================
   CHART HELPERS (inline SVG, theme-token aware)
   ============================================================ */
function svgLineChart(id, series, labels, opts){
  opts = opts||{};
  const w=560,h=200,padL=34,padR=14,padT=16,padB=26;
  const max = opts.max || Math.max(...series.flatMap(s=>s.data), 10);
  const stepX = (w-padL-padR)/(labels.length-1||1);
  function pt(d,i){ const x=padL+i*stepX; const y=padT+(h-padT-padB)*(1-d/max); return [x,y]; }
  const grid = [0,0.25,0.5,0.75,1].map(f=>{ const y=padT+(h-padT-padB)*(1-f); return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${padL-8}" y="${y+3}" font-size="9" text-anchor="end" fill="var(--text-muted)">${Math.round(max*f)}</text>`; }).join('');
  const paths = series.map((s,si)=>{
    const pts = s.data.map((d,i)=>pt(d,i));
    const d0 = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area = `M${pts[0][0]},${h-padB} ` + pts.map(p=>`L${p[0]},${p[1]}`).join(' ') + ` L${pts[pts.length-1][0]},${h-padB} Z`;
    return `<path d="${area}" fill="${s.color}" opacity="0.12"></path>
      <path d="${d0}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`).join('')}`;
  }).join('');
  const xlabels = labels.map((l,i)=>{ const x=padL+i*stepX; return `<text x="${x}" y="${h-6}" font-size="9" text-anchor="middle" fill="var(--text-muted)">${esc(l)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;font-family:var(--font);">${grid}${paths}${xlabels}</svg>`;
}
function svgDonut(id, segments, size){
  size = size||150; const r=size/2-12, cx=size/2, cy=size/2, cw=14;
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  let angle=-90;
  const paths = segments.map(s=>{
    const frac = s.value/total; const a0=angle; const a1=angle+frac*360; angle=a1;
    const large = (a1-a0)>180?1:0;
    const p0=[cx+r*Math.cos(a0*Math.PI/180), cy+r*Math.sin(a0*Math.PI/180)];
    const p1=[cx+r*Math.cos(a1*Math.PI/180), cy+r*Math.sin(a1*Math.PI/180)];
    return `<path d="M${p0[0]},${p0[1]} A${r},${r} 0 ${large} 1 ${p1[0]},${p1[1]}" fill="none" stroke="${s.color}" stroke-width="${cw}" stroke-linecap="${segments.length>1?'butt':'round'}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;">${paths}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text-primary)">${total}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">Total</text></svg>`;
}
function svgBarChart(bars, opts){
  opts=opts||{}; const w=560,h=200,padL=30,padR=10,padT=14,padB=26;
  const max = opts.max || Math.max(...bars.map(b=>b.value),10);
  const bw = (w-padL-padR)/bars.length*0.6;
  const gap = (w-padL-padR)/bars.length;
  const grid=[0,0.5,1].map(f=>{ const y=padT+(h-padT-padB)*(1-f); return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`; }).join('');
  const b = bars.map((bar,i)=>{
    const bh = (h-padT-padB)*(bar.value/max);
    const x = padL + i*gap + (gap-bw)/2;
    const y = h-padB-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${bar.color||'var(--emerald-500)'}"/>
      <text x="${x+bw/2}" y="${h-padB+11}" font-size="9" text-anchor="middle" fill="var(--text-muted)">${esc(bar.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${grid}${b}</svg>`;
}

    jenisKelamin:g('f_jenisKelamin'), tempatLahir:g('f_tempatLahir'), tanggalLahir:g('f_tanggalLahir'), alamat:g('f_alamat'),
    kelas:g('f_kelas'), rombel:g('f_rombel'), tahunMasuk:g('f_tahunMasuk'), statusSantri:g('f_statusSantri'), asalSekolah:g('f_asalSekolah'),

  };

function openSantriModal(editId){
  const existing = editId ? DB.santri.find(s=>s.id===editId) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?'Edit Data Santri':'Tambah Santri Baru'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">${santriForm(existing)}</div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Batal</button><button class="btn btn-primary" id="saveSantriBtn">${existing?'Simpan Perubahan':'Simpan Santri'}</button></div>
  `, {wide:true});
  document.getElementById('saveSantriBtn').addEventListener('click', ()=>{
    const data = readSantriForm();
    if(!data.nama){ toast('Nama lengkap wajib diisi.','err'); return; }
    if(existing){
      Object.assign(existing, data);
      toast('Data santri berhasil diperbarui.');
    } else {
      // ID dihitung dari nomor tertinggi yang sudah ada (bukan dari panjang array) supaya
      // tidak bentrok dengan santri lain jika sebelumnya pernah ada data yang dihapus.
      const maxNum = DB.santri.reduce((max,s)=>{ const m = /^S(\d+)$/.exec(s.id); return m ? Math.max(max, parseInt(m[1],10)) : max; }, 0);
      const id = "S"+String(maxNum+1).padStart(3,'0');
      // Santri baru mulai dari progres hafalan 0% -- BUKAN data contoh acak -- karena ini
      // aplikasi produksi dengan data sungguhan; progres akan naik seiring setoran nyata dicatat.
      const newS = { id, ...data, quranProgress: Array.from({length:30},(_,i)=>({n:i+1, persen:0})), safinahBab: [...SAFINAH_BAB_DEFAULT], safinahProgress: SAFINAH_BAB_DEFAULT.map((_,i)=>({n:i+1, persen:0})), foto:null };
      DB.santri.push(newS);
      toast('Santri baru berhasil ditambahkan.');
    }
    closeModal();
    navigate('santri-list');
  });
}

function santriFilteredList(){
  return DB.santri.filter(s=>{
    if(santriUIState.search){ const q=santriUIState.search.toLowerCase(); if(!(s.nama.toLowerCase().includes(q)||s.nomorInduk.includes(q))) return false; }
    if(santriUIState.kelas && s.kelas!==santriUIState.kelas) return false;
    if(santriUIState.gender && s.jenisKelamin!==santriUIState.gender) return false;
    if(santriUIState.kamar && s.kamar!==santriUIState.kamar) return false;
    return true;
  });
}

/* ============================================================
   EXPORT (Excel via downloads capability) & PRINT HELPERS
   ============================================================ */
let DOWNLOADS_NS = null;
async function getDownloads(){
  if(!window.claude || !window.claude.use) return null;
  if(DOWNLOADS_NS) return DOWNLOADS_NS;
  try{ DOWNLOADS_NS = await window.claude.use('downloads'); }catch(e){ DOWNLOADS_NS = null; }
  return DOWNLOADS_NS;
}
async function exportRowsToExcel(filename, headers, rows){
  try{
    if(typeof XLSX === 'undefined'){ toast('Pustaka Excel belum siap, coba lagi sesaat.','err'); return; }
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const dl = await getDownloads();
    if(!dl){ toast('Fitur unduh berkas tidak tersedia pada tampilan ini.','err'); return; }
    const res = await dl.save({ filename, data: buf });
    toast(res.status==='saved' ? `Berkas ${filename} berhasil disimpan.` : 'Berkas telah dikirim.');
  }catch(err){
    if(err && err.code==='declined'){ return; }
    toast('Ekspor dibatalkan atau gagal: ' + (err&&err.message||'kesalahan tidak diketahui'), 'err');
  }
}
function exportSantriExcel(list){
  const headers = ['No Induk','NIS','NISN','Nama','Kelamin','Kelas','Rombel','Kamar','Asrama','Nama Ayah','Nama Ibu','No HP Wali','Status'];
  const rows = list.map(s=>[s.nomorInduk,s.nis,s.nisn,s.nama,s.jenisKelamin,s.kelas,s.rombel,s.kamar,s.asrama,s.namaAyah,s.namaIbu,s.noHpWali,s.statusSantri]);
  exportRowsToExcel('Data-Santri-EPondokSMP.xlsx', headers, rows);
}

/* ---------- Kelola Kelas & Kamar (tambah/edit/hapus) ---------- */
function kelasNameTaken(nama, exceptName){
  return DB.kelasList.some(k=>k.toLowerCase()===nama.toLowerCase() && k!==exceptName);
}
function openKelasModal(existingName){
  const isEdit = existingName != null;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Kelas':'Tambah Kelas'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nama Kelas</label><input class="input" id="f_namaKelas" value="${esc(existingName||'')}" placeholder="mis. 7C" autofocus></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Batal</button><button class="btn btn-primary" id="saveKelasBtn">Simpan</button></div>
  `);
  document.getElementById('saveKelasBtn').addEventListener('click', ()=>{
    const nama = document.getElementById('f_namaKelas').value.trim();
    if(!nama){ toast('Nama kelas wajib diisi.','err'); return; }
    if(kelasNameTaken(nama, isEdit?existingName:null)){ toast('Nama kelas tersebut sudah ada.','err'); return; }
    if(isEdit){
      DB.santri.forEach(s=>{
        if(s.kelas===existingName){
          if(s.rombel && s.rombel.indexOf(existingName)===0) s.rombel = nama + s.rombel.slice(existingName.length);
          s.kelas = nama;
        }
      });
      const idx = DB.kelasList.indexOf(existingName);
      DB.kelasList[idx] = nama;
      toast('Kelas berhasil diperbarui.');
    } else {
      DB.kelasList.push(nama);
      toast('Kelas baru berhasil ditambahkan.');
    }
    saveToStorage();
    closeModal();
    navigate('santri-kelas');
  });
}
function deleteKelas(nama){
  const count = DB.santri.filter(s=>s.kelas===nama).length;
  if(count>0){ toast(`Tidak bisa menghapus, masih ada ${count} santri di kelas ${nama}. Pindahkan santri terlebih dahulu.`,'err'); return; }
  confirmDelete(`Hapus kelas "${nama}"? Tindakan ini tidak bisa dibatalkan.`, ()=>{
    DB.kelasList = DB.kelasList.filter(k=>k!==nama);
    saveToStorage();
    toast('Kelas berhasil dihapus.');
    navigate('santri-kelas');
  });
}

function kamarNameTaken(nama, exceptName){
  return DB.kamarList.some(k=>k.nama.toLowerCase()===nama.toLowerCase() && k.nama!==exceptName);
}
function openKamarModal(existingName){
  const existing = existingName!=null ? DB.kamarList.find(k=>k.nama===existingName) : null;
  const isEdit = !!existing;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Kamar':'Tambah Kamar'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nama Kamar</label><input class="input" id="f_namaKamar" value="${esc(existing?existing.nama:'')}" placeholder="mis. Ar-Raudhah 3" autofocus></div>
      <div class="field"><label>Asrama</label><select class="input" id="f_asramaKamar"><option ${existing&&existing.asrama==='Putra'?'selected':''}>Putra</option><option ${existing&&existing.asrama==='Putri'?'selected':''}>Putri</option></select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Batal</button><button class="btn btn-primary" id="saveKamarBtn">Simpan</button></div>
  `);
  document.getElementById('saveKamarBtn').addEventListener('click', ()=>{
    const nama = document.getElementById('f_namaKamar').value.trim();
    const asrama = document.getElementById('f_asramaKamar').value;
    if(!nama){ toast('Nama kamar wajib diisi.','err'); return; }
    if(kamarNameTaken(nama, isEdit?existing.nama:null)){ toast('Nama kamar tersebut sudah ada.','err'); return; }
    if(isEdit){
      DB.santri.forEach(s=>{ if(s.kamar===existing.nama){ s.kamar=nama; s.asrama=asrama; } });
      const idx = DB.kamarList.findIndex(k=>k.nama===existing.nama);
      DB.kamarList[idx] = { nama, asrama };
      toast('Kamar berhasil diperbarui.');
    } else {
      DB.kamarList.push({ nama, asrama });
      toast('Kamar baru berhasil ditambahkan.');
    }
    saveToStorage();
    closeModal();
    navigate('santri-kamar');
  });
}
function deleteKamar(nama){
  const count = DB.santri.filter(s=>s.kamar===nama).length;
  if(count>0){ toast(`Tidak bisa menghapus, masih ada ${count} santri di kamar ${nama}. Pindahkan santri terlebih dahulu.`,'err'); return; }
  confirmDelete(`Hapus kamar "${nama}"? Tindakan ini tidak bisa dibatalkan.`, ()=>{
    DB.kamarList = DB.kamarList.filter(k=>k.nama!==nama);
    saveToStorage();
    toast('Kamar berhasil dihapus.');
    navigate('santri-kamar');
  });
}

function orgChartHtml(){
  const byLevel = lvl => DB.pengurus.filter(p=>p.level===lvl && p.status==='Aktif');
  const single = lvl => byLevel(lvl)[0];
  const divisi = DB.pengurus.filter(p=>p.level===6 && p.status==='Aktif');
  const nodeHtml = (p,top)=> p ? `<div class="org-node ${top?'top':''}"><div class="jbt">${esc(p.jabatan)}</div><div class="nmm">${esc(p.nama)}</div></div>` : '';
  return `
  <div class="orgchart">
    ${nodeHtml(single(0), true)}
    <div class="org-connector"></div>
    ${nodeHtml(single(1), true)}
    <div class="org-connector"></div>
    ${nodeHtml(single(2))}
    <div class="org-connector"></div>
    <div style="display:flex;gap:26px;flex-wrap:wrap;justify-content:center;">${nodeHtml(single(3))}${nodeHtml(single(4))}${nodeHtml(single(5))}</div>
    <div class="org-connector"></div>
    <div class="divisi-grid" style="max-width:900px;">
      ${divisi.map(p=>nodeHtml(p)).join('')}
    </div>
  </div>`;
}

function openPengurusModal(id){
  const existing = id ? DB.pengurus.find(x=>x.id===id) : null;
  openModal(`<div class="modal-head"><h3>${existing?'Edit Pengurus':'Tambah Pengurus'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">${pengurusForm(existing)}</div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Batal</button><button class="btn btn-primary" id="savePengurusBtn">Simpan</button></div>`);
  document.getElementById('savePengurusBtn').addEventListener('click', ()=>{
    const g=id=>document.getElementById(id).value;
    const data = { nama:g('fp_nama'), jabatan:g('fp_jabatan'), periode:g('fp_periode'), kontak:g('fp_kontak'), level:parseInt(g('fp_level')||6), status:g('fp_status'), deskripsi:g('fp_deskripsi'), foto:null };
    if(!data.nama||!data.jabatan){ toast('Nama dan jabatan wajib diisi.','err'); return; }
    if(existing){ Object.assign(existing,data); toast('Data pengurus diperbarui.'); }
    else { DB.pengurus.push({ id:uid('P'), ...data }); toast('Pengurus baru ditambahkan.'); }
    closeModal(); navigate('struktur-data');
  });
}

function renderKegiatanKalender(){
  const m = STATE.calMonth;
  const y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y,mo,1); const startOffset = first.getDay();
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  const monthLabel = m.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const canEdit = ['admin','pengurus'].includes(STATE.currentUser.role);
  return `
  ${pageHead('Kalender Kegiatan', null, `<div class="view-toggle no-print"><button class="${kegiatanUIState.viewMode==='daftar'?'active':''}" id="vmList">Daftar</button><button class="${kegiatanUIState.viewMode==='kalender'?'active':''}" id="vmCal">Kalender</button></div>${canEdit?`<button class="btn btn-primary" id="addKegiatanBtn">+ Tambah Kegiatan</button>`:''}`)}
  <div class="card card-pad">
    <div class="row-between" style="margin-bottom:14px;">
      <button class="btn-icon" id="calPrev">&#8592;</button>
      <h3 style="text-transform:capitalize;">${monthLabel}</h3>
      <button class="btn-icon" id="calNext">&#8594;</button>
    </div>
    <div class="cal-grid">
      ${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return `<div class="cal-cell other-month"></div>`;
        const dateStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const evts = DB.kegiatan.filter(k=>k.tanggal===dateStr);
        const isToday = dateStr === todayStr();
        return `<div class="cal-cell ${isToday?'today':''}"><div class="dnum">${d}</div>${evts.slice(0,2).map(e=>`<div class="cal-evt" data-viewk="${e.id}">${esc(e.nama)}</div>`).join('')}${evts.length>2?`<div style="font-size:9.5px;color:var(--text-muted);margin-top:2px;">+${evts.length-2} lainnya</div>`:''}</div>`;
      }).join('')}
    </div>
  </div>`;
}

function bindKegiatanCommon(){
  const vmList = document.getElementById('vmList'); if(vmList) vmList.addEventListener('click', ()=>{ kegiatanUIState.viewMode='daftar'; navigate('kegiatan-daftar'); });
  const vmCal = document.getElementById('vmCal'); if(vmCal) vmCal.addEventListener('click', ()=>{ kegiatanUIState.viewMode='kalender'; navigate('kegiatan-daftar'); });
  const addBtn = document.getElementById('addKegiatanBtn'); if(addBtn) addBtn.addEventListener('click', ()=>openKegiatanModal(null));
  const s = document.getElementById('kegSearch'); if(s) s.addEventListener('input', e=>{ kegiatanUIState.search=e.target.value; rerenderContentOnly(); });
  const kc = document.getElementById('kegKategori'); if(kc) kc.addEventListener('change', e=>{ kegiatanUIState.kategori=e.target.value; rerenderContentOnly(); });
  on('[data-viewk]','click', e=>{ const k=DB.kegiatan.find(x=>x.id===e.currentTarget.dataset.viewk); if(k) kegiatanDetailToast(k); });
  on('[data-editk]','click', e=>openKegiatanModal(e.currentTarget.dataset.editk));
  on('[data-delk]','click', e=>{ const id=e.currentTarget.dataset.delk; const k=DB.kegiatan.find(x=>x.id===id);
    confirmDelete(`Kegiatan "${k.nama}" akan dihapus.`, ()=>{ DB.kegiatan=DB.kegiatan.filter(x=>x.id!==id); toast('Kegiatan dihapus.'); navigate('kegiatan-daftar'); }); });
  const prev = document.getElementById('calPrev'); if(prev) prev.addEventListener('click', ()=>{ STATE.calMonth = new Date(STATE.calMonth.getFullYear(), STATE.calMonth.getMonth()-1, 1); rerenderContentOnly(); });
  const next = document.getElementById('calNext'); if(next) next.addEventListener('click', ()=>{ STATE.calMonth = new Date(STATE.calMonth.getFullYear(), STATE.calMonth.getMonth()+1, 1); rerenderContentOnly(); });
}

function openSetoranQuranModal(id){
  const existing = id ? DB.setoranQuran.find(x=>x.id===id) : null;
  openModal(`<div class="modal-head"><h3>${existing?'Edit Setoran Hafalan':'Tambah Setoran Hafalan Al-Qur\'an'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">${setoranQuranForm(existing)}</div>
    <div class="modal-foot"><button class="btn btn-outline" data-close-modal>Batal</button><button class="btn btn-primary" id="saveQBtn">Simpan Setoran</button></div>`, {wide:true});
  document.getElementById('saveQBtn').addEventListener('click', ()=>{
    const g=id=>document.getElementById(id).value;
    const santri = DB.santri.find(s=>s.id===g('fq_santri'));
    const data = { santriId:santri.id, santriNama:santri.nama, tanggal:g('fq_tanggal'), juz:parseInt(g('fq_juz')), surat:g('fq_surat'), ayatMulai:parseInt(g('fq_ayatMulai')), ayatAkhir:parseInt(g('fq_ayatAkhir')), jenis:g('fq_jenis'), nilai:parseInt(g('fq_nilai')), kelancaran:g('fq_kelancaran'), tajwid:g('fq_tajwid'), makhraj:g('fq_makhraj'), penyimak:g('fq_penyimak'), catatan:g('fq_catatan') };
    if(existing){ Object.assign(existing,data); toast('Setoran hafalan diperbarui.'); }
    else {
      DB.setoranQuran.push({ id:uid('SQ'), ...data });
      const prog = santri.quranProgress.find(p=>p.n===data.juz); if(prog) prog.persen = Math.min(100, prog.persen + (data.kelancaran==='Lancar'?15:5));
      toast('Setoran hafalan berhasil dicatat.');
    }
    closeModal(); navigate('quran-setoran');
  });
}

function openSetoranSafinahModal(id){
  const existing = id ? DB.setoranSafinah.find(x=>x.id===id) : null;
  openModal(`<div class="modal-head"><h3>${existing?'Edit Setoran Safinah':'Tambah Setoran Safinah'}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
    <div class="modal-body">${setoranSafinahForm(existing)}</div>

  document.getElementById('saveSBtn').addEventListener('click', ()=>{
    const g=id=>document.getElementById(id).value;
    const santri = DB.santri.find(s=>s.id===g('fs_santri'));
    const data = { santriId:santri.id, santriNama:santri.nama, tanggal:g('fs_tanggal'), bab:parseInt(g('fs_bab')), materi:babMateri(santri.safinahBab[parseInt(g('fs_bab'))-1]), halaman:g('fs_halaman'), nilai:parseInt(g('fs_nilai')), kelancaran:g('fs_kelancaran'), status:g('fs_status'), penyimak:g('fs_penyimak'), teks:g('fs_teks'), catatan:g('fs_catatan') };
    if(existing){ Object.assign(existing,data); toast('Setoran Safinah diperbarui.'); }
    else {
      DB.setoranSafinah.push({ id:uid('SS'), ...data });
      const prog = santri.safinahProgress.find(p=>p.n===data.bab); if(prog) prog.persen = Math.min(100, prog.persen + (data.kelancaran==='Lancar'?20:5));

  });

            <span class="tag-badge">${esc(k.kategori)}</span><span class="pill pill-good">${hadir}/${records.length} Hadir (${Math.round(hadir/records.length*100)}%)</span>
          </div>
          <div class="table-wrap"><table><thead><tr><th>Santri</th><th>Kelas</th><th>Status</th></tr></thead>
          <tbody>${records.map(r=>`<tr><td>${esc(r.santriNama)}</td><td>${esc(r.kelas)}</td><td>
            <select class="input select-filter" style="padding:6px 26px 6px 10px;" data-absstatus="${r.id}">
              ${['Hadir','Izin','Sakit','Alpha'].map(st=>`<option ${r.status===st?'selected':''}>${st}</option>`).join('')}
            </select>
          </td></tr>`).join('')}</tbody></table></div>
          <div style="margin-top:14px;display:flex;gap:10px;"><button class="btn btn-primary" id="saveAbsensiBtn">&#10003; Simpan Absensi</button><button class="btn btn-outline" id="printAbsensiBtn">&#128424; Cetak</button></div>
        </div>
      </div>
      <div class="card card-pad" style="text-align:center;">
        <div class="section-title" style="margin-bottom:10px;text-align:left;">QR Code Absensi</div>
        <p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px;">Santri dapat memindai kode ini untuk melakukan absensi mandiri pada kegiatan terpilih.</p>
        <div id="qrHolder" style="display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--border);"></div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-muted);">Kode: EPSMP-${esc(k.id)}-${esc(k.tanggal)}</div>
        <button class="btn btn-outline btn-sm" style="margin-top:14px;" id="simulateScanBtn">Simulasikan Scan Santri</button>
      </div>
    </div>`;
  },
  bind(){
    const absKegSelect = document.getElementById('absKegSelect');
    if(!absKegSelect) return; // tidak ada kegiatan sama sekali -- tampilan empty-state, tidak ada elemen untuk di-bind
    absKegSelect.addEventListener('change', e=>{ absensiUIState.kegiatanId=e.target.value; rerenderContentOnly(); });
    // PENTING: setiap perubahan status absensi HARUS langsung memicu penyimpanan
    // (saveToStorage -> sinkron ke server), bukan cuma mengubah data di memori.
    // Sebelumnya perubahan di sini tidak pernah tersimpan/tersinkron sampai ada
    // navigasi lain yang kebetulan memicu render() -- kalau pengguna langsung
    // menutup tab setelah menandai absensi, perubahannya bisa hilang begitu saja
    // walau tombol "Simpan Absensi" sudah menampilkan pesan berhasil.
    on('[data-absstatus]','change', e=>{ const id=e.currentTarget.dataset.absstatus; const rec=DB.absensi.find(x=>x.id===id); rec.status=e.target.value; saveToStorage(); });
    document.getElementById('saveAbsensiBtn').addEventListener('click', ()=>{ saveToStorage(); toast('Absensi kegiatan berhasil disimpan.'); });
    document.getElementById('printAbsensiBtn').addEventListener('click', ()=>{
      const records = getAbsensiForKegiatan(absensiUIState.kegiatanId);
      const rows = records.map(r=>`<tr><td>${esc(r.santriNama)}</td><td>${esc(r.kelas)}</td><td>${esc(r.status)}</td></tr>`).join('');
      doPrint(`<div class="print-table"><table><thead><tr><th>Santri</th><th>Kelas</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`, 'Absensi — ' + DB.kegiatan.find(x=>x.id===absensiUIState.kegiatanId).nama);
    });
    try{
      const holder = document.getElementById('qrHolder');
      if(typeof QRCode !== 'undefined'){
        new QRCode(holder, { text: `EPSMP-${absensiUIState.kegiatanId}-${todayStr()}`, width:140, height:140, colorDark:"#065f46", colorLight:"#ffffff" });
      } else { holder.innerHTML = '<div style="width:140px;height:140px;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);border-radius:8px;font-size:11px;color:var(--text-muted);">QR tidak tersedia</div>'; }
    }catch(e){}
    document.getElementById('simulateScanBtn').addEventListener('click', ()=>{
      const records = getAbsensiForKegiatan(absensiUIState.kegiatanId);
      const belum = records.find(r=>r.status!=='Hadir');
      if(belum){ belum.status='Hadir'; toast(`${belum.santriNama} berhasil absen via QR Code.`); rerenderContentOnly(); }
      else toast('Seluruh santri telah tercatat hadir.');
    });
  }
};

function reportShell(title, sub, tableHtml, onExcel, onPrint){
  return `${pageHead(title, sub, `<button class="btn btn-outline" id="repExcelBtn">&#11015; Export Excel</button><button class="btn btn-outline" id="repPdfBtn">&#128424; Download PDF</button><button class="btn btn-primary" id="repPrintBtn">&#128424; Cetak</button>`)}

}

  document.getElementById('repExcelBtn').addEventListener('click', excelFn);

  document.getElementById('repPrintBtn').addEventListener('click', printFn);
}

            <div class="field"><label>Nomor Kontak</label><input class="input" id="st_kontak" value="${esc(s.kontak)}"></div>
            <div class="field"><label>Email</label><input class="input" id="st_email" value="${esc(s.email)}"></div>
            <div class="field"><label>Tahun Ajaran</label><input class="input" id="st_tahunAjaran" value="${esc(s.tahunAjaran)}"></div>
            <div class="field"><label>Periode Kepengurusan</label><input class="input" id="st_periode" value="${esc(s.periodeKepengurusan)}"></div>
          </div>
          <button class="btn btn-primary" id="saveSettingsBtn" style="margin-top:8px;">Simpan Perubahan</button>
        </div>
        <div class="card card-pad" style="text-align:center;">
          <div class="section-title" style="margin-bottom:14px;text-align:left;">Logo Pondok</div>
          <div style="width:120px;height:120px;margin:0 auto 14px;border-radius:20px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);">
            <img id="logoPreview" src="${s.logo}" style="width:80px;height:80px;object-fit:contain;">
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Logo akan otomatis digunakan pada halaman login, header, sidebar, dashboard, cetak laporan, dan kartu santri.</p>
          <input type="file" id="logoUpload" accept="image/*" class="hidden">
          <button class="btn btn-outline btn-sm" id="logoUploadBtn">&#128193; Unggah Logo Baru</button>
        </div>
      </div>
    </div>
    <div id="tabProfil" class="tab-panel ${panelHidden('profil')}">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:6px;">Profil Pondok (Tampil di Situs Publik)</div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Isi bagian ini digunakan pada halaman publik "Beranda" (Tentang Pondok) dan "Profil Pondok" — Sejarah, Visi, Misi, dan Nilai-nilai Pondok.</p>
        <div class="field full" style="margin-bottom:16px;">
          <label>Foto Profil Pondok</label>
          <p style="font-size:12px;color:var(--text-muted);margin:2px 0 10px;">Foto ini tampil di halaman publik "Beranda" dan "Profil Pondok", menggantikan ikon bawaan.</p>
          <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
            <div style="width:160px;aspect-ratio:4/3;border-radius:12px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);flex:none;">
              ${s.fotoProfil ? `<img id="profilFotoPreview" src="${s.fotoProfil}" style="width:100%;height:100%;object-fit:cover;">` : `<span style="font-size:32px;color:var(--text-muted);">&#127963;</span>`}
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <input type="file" id="profilFotoUpload" accept="image/*" class="hidden">
              <button type="button" class="btn btn-outline btn-sm" id="profilFotoUploadBtn">&#128193; ${s.fotoProfil?'Ganti Foto':'Unggah Foto'}</button>
              ${s.fotoProfil?`<button type="button" class="btn btn-outline btn-sm" id="profilFotoRemoveBtn">&times; Hapus Foto</button>`:''}
            </div>
          </div>
        </div>
        <div class="form-grid">
          <div class="field full"><label>Sejarah Pondok</label><textarea class="input" id="st_sejarah" rows="5" style="resize:vertical;">${esc(s.sejarah)}</textarea></div>
          <div class="field full"><label>Visi</label><textarea class="input" id="st_visi" rows="3" style="resize:vertical;">${esc(s.visi)}</textarea></div>
        </div>
        <div class="field full" style="margin-top:14px;">
          <label>Misi</label>
          <div id="misiList">
            ${s.misi.map(m=>`<div class="misi-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center;"><input class="input misi-input" value="${esc(m)}" style="flex:1;"><button type="button" class="btn-icon" data-remove-misi title="Hapus">&times;</button></div>`).join('')}
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="addMisiBtn">&#43; Tambah Misi</button>
        </div>
        <div class="field full" style="margin-top:18px;">
          <label>Nilai-nilai Pondok (ikon &amp; label)</label>
          <div id="nilaiList">
            ${s.nilai.map(n=>`<div class="nilai-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center;"><input class="input nilai-ic" value="${n.ic}" placeholder="Ikon" style="width:70px;text-align:center;flex:none;"><input class="input nilai-label" value="${esc(n.label)}" placeholder="Label" style="flex:1;"><button type="button" class="btn-icon" data-remove-nilai title="Hapus">&times;</button></div>`).join('')}
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="addNilaiBtn">&#43; Tambah Nilai</button>
          <p style="font-size:11.5px;color:var(--text-muted);margin-top:6px;">Isi kolom ikon dengan satu emoji, mis. &#128214; &#127963; &#10084; &#129497;</p>
        </div>
        <button class="btn btn-primary" id="saveProfilBtn" style="margin-top:18px;">Simpan Profil Pondok</button>
      </div>
    </div>
    <div id="tabAkun" class="tab-panel ${panelHidden('akun')}">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:14px;">Akun Saya</div>
        <div class="form-grid">
          <div class="field"><label>Nama</label><input class="input" value="${esc(STATE.currentUser.nama)}" disabled></div>
          <div class="field"><label>Email</label><input class="input" value="${esc(STATE.currentUser.email)}" disabled></div>
          <div class="field"><label>Kata Sandi Baru</label><input type="password" class="input" placeholder="••••••••"></div>
          <div class="field"><label>Konfirmasi Kata Sandi</label><input type="password" class="input" placeholder="••••••••"></div>
        </div>
        <button class="btn btn-primary" id="changePwBtn" style="margin-top:8px;">Perbarui Kata Sandi</button>
      </div>
    </div>
    <div id="tabRole" class="tab-panel ${panelHidden('role')}">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:14px;">Hak Akses Role</div>
        <div class="table-wrap" style="border:none;"><table><thead><tr><th>Role</th><th>Deskripsi Akses</th></tr></thead>
        <tbody>
          <tr><td><span class="tag-badge">Admin</span></td><td>Akses penuh ke seluruh modul dan pengaturan sistem.</td></tr>
          <tr><td><span class="tag-badge">Pengurus</span></td><td>Mengelola data kegiatan, jadwal, absensi, dan data kewenangannya.</td></tr>
          <tr><td><span class="tag-badge">Ustadz/Ustadzah</span></td><td>Mengelola setoran hafalan santri dan melihat data santri binaannya.</td></tr>
          <tr><td><span class="tag-badge">Santri</span></td><td>Melihat profil pribadi, jadwal kegiatan, progres hafalan, dan info pondok.</td></tr>
        </tbody></table></div>
      </div>
    </div>
    <div id="tabBackup" class="tab-panel ${panelHidden('backup')}">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:10px;">Backup &amp; Restore Database</div>
        <p style="font-size:12.8px;color:var(--text-secondary);margin-bottom:16px;">Buat cadangan seluruh data sistem (santri, pengurus, kegiatan, hafalan, absensi) atau pulihkan dari cadangan sebelumnya.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-outline" id="backupBtn">&#128190; Backup Database</button>
          <button class="btn btn-outline" id="restoreBtn">&#8635; Restore Database</button>
        </div>
        <div style="margin-top:14px;font-size:11.5px;color:var(--text-muted);">Backup terakhir: 18 September 2026, 23:00 WIB (otomatis)</div>
      </div>
    </div>`;
  },
  bind(){
    document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
      const g=id=>document.getElementById(id).value;
      Object.assign(STATE.settings, { namaPondok:g('st_namaPondok'), namaAplikasi:g('st_namaApp'), subjudul:g('st_subjudul'), alamat:g('st_alamat'), kontak:g('st_kontak'), email:g('st_email'), tahunAjaran:g('st_tahunAjaran'), periodeKepengurusan:g('st_periode') });
      toast('Pengaturan pondok berhasil disimpan.'); render();
    });
    const logoBtn = document.getElementById('logoUploadBtn'); const logoInput = document.getElementById('logoUpload');
    logoBtn.addEventListener('click', ()=>logoInput.click());
    logoInput.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      if(!file.type.startsWith('image/')){ toast('Berkas harus berupa gambar (PNG/JPG).', 'err'); return; }
      resizeImageToDataUrl(file, 320).then(dataUrl=>{
        STATE.settings.logo = dataUrl;
        toast('Logo pondok berhasil diperbarui.'); render();
      }).catch(err=>{
        console.warn('Gagal memproses logo:', err);
        toast('Gagal memproses gambar logo. Coba gambar lain.', 'err');
      });
    });
    on('.tab-btn','click', e=>{
      $all('.tab-btn').forEach(t=>t.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const tab = e.currentTarget.dataset.tab;
      STATE.pengaturanTab = tab;
      $all('.tab-panel').forEach(p=>p.classList.add('hidden'));
      document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.remove('hidden');
    });
    const profilFotoBtn = document.getElementById('profilFotoUploadBtn'); const profilFotoInput = document.getElementById('profilFotoUpload');
    if(profilFotoBtn) profilFotoBtn.addEventListener('click', ()=>profilFotoInput.click());
    if(profilFotoInput) profilFotoInput.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      if(!file.type.startsWith('image/')){ toast('Berkas harus berupa gambar (PNG/JPG).', 'err'); return; }
      resizeImageToDataUrl(file, 900).then(dataUrl=>{
        STATE.settings.fotoProfil = dataUrl;
        toast('Foto profil pondok berhasil diperbarui.');
        STATE.pengaturanTab = 'profil';
        render();
      }).catch(err=>{
        console.warn('Gagal memproses foto profil:', err);
        toast('Gagal memproses gambar. Coba gambar lain.', 'err');
      });
    });
    const profilFotoRemoveBtn = document.getElementById('profilFotoRemoveBtn');
    if(profilFotoRemoveBtn) profilFotoRemoveBtn.addEventListener('click', ()=>{
      STATE.settings.fotoProfil = null;
      toast('Foto profil pondok dihapus.');
      STATE.pengaturanTab = 'profil';
      render();
    });
    const addMisiBtn = document.getElementById('addMisiBtn');
    if(addMisiBtn) addMisiBtn.addEventListener('click', ()=>{
      const wrap = document.getElementById('misiList');
      const row = document.createElement('div');
      row.className = 'misi-row';
      row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
      row.innerHTML = `<input class="input misi-input" placeholder="Tulis misi..." style="flex:1;"><button type="button" class="btn-icon" data-remove-misi title="Hapus">&times;</button>`;
      wrap.appendChild(row);
      row.querySelector('.misi-input').focus();
    });
    const addNilaiBtn = document.getElementById('addNilaiBtn');
    if(addNilaiBtn) addNilaiBtn.addEventListener('click', ()=>{
      const wrap = document.getElementById('nilaiList');
      const row = document.createElement('div');
      row.className = 'nilai-row';
      row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
      row.innerHTML = `<input class="input nilai-ic" placeholder="Ikon" style="width:70px;text-align:center;flex:none;"><input class="input nilai-label" placeholder="Label" style="flex:1;"><button type="button" class="btn-icon" data-remove-nilai title="Hapus">&times;</button>`;
      wrap.appendChild(row);
      row.querySelector('.nilai-ic').focus();
    });
    on('[data-remove-misi]','click', e=>{ e.currentTarget.closest('.misi-row').remove(); });
    on('[data-remove-nilai]','click', e=>{ e.currentTarget.closest('.nilai-row').remove(); });
    const saveProfilBtn = document.getElementById('saveProfilBtn');
    if(saveProfilBtn) saveProfilBtn.addEventListener('click', ()=>{
      const sejarah = document.getElementById('st_sejarah').value.trim();
      const visi = document.getElementById('st_visi').value.trim();
      const misi = $all('.misi-input').map(i=>i.value.trim()).filter(v=>v);
      const nilai = $all('.nilai-row').map(row=>({
        ic: row.querySelector('.nilai-ic').value.trim(),
        label: row.querySelector('.nilai-label').value.trim()
      })).filter(n=>n.label);
      if(!sejarah || !visi || !misi.length){ toast('Sejarah, Visi, dan minimal 1 Misi wajib diisi.'); return; }
      Object.assign(STATE.settings, { sejarah, visi, misi, nilai });
      STATE.pengaturanTab = 'profil';
      toast('Profil pondok berhasil disimpan.'); render();
    });
    const pwBtn = document.getElementById('changePwBtn'); if(pwBtn) pwBtn.addEventListener('click', ()=>toast('Kata sandi berhasil diperbarui.'));
    const bkBtn = document.getElementById('backupBtn'); if(bkBtn) bkBtn.addEventListener('click', ()=>{
      const json = JSON.stringify({ santri:DB.santri.length, pengurus:DB.pengurus.length, kegiatan:DB.kegiatan.length, setoranQuran:DB.setoranQuran.length, setoranSafinah:DB.setoranSafinah.length, absensi:DB.absensi.length, waktu:new Date().toISOString() });
      exportRowsToExcel('Backup-EPondokSMP.xlsx', ['Ringkasan Backup','Nilai'], [['Total Santri',DB.santri.length],['Total Pengurus',DB.pengurus.length],['Total Kegiatan',DB.kegiatan.length],['Total Setoran Quran',DB.setoranQuran.length],['Total Setoran Safinah',DB.setoranSafinah.length],['Total Absensi',DB.absensi.length],['Waktu Backup', new Date().toLocaleString('id-ID')]]);
    });
    const rsBtn = document.getElementById('restoreBtn'); if(rsBtn) rsBtn.addEventListener('click', ()=>toast('Pilih berkas cadangan (.xlsx) untuk memulihkan data (simulasi).'));
  }
};

/* ============================================================
   ESCAPE KEY CLOSES MODAL
   ============================================================ */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============================================================
   BOOT
   ============================================================ */
loadFromStorage(); // tampilkan cache lokal dulu, biar cepat
render();
loadFromServer();  // lalu segarkan dengan data terbaru dari server (sinkron antar perangkat)

/* ============================================================
   PENYEGARAN OTOMATIS ANTAR PERANGKAT
   Tab/perangkat yang dibiarkan terbuka lama (mis. HP yang tidak
   ditutup, atau tab lain di laptop yang sama) bisa punya data yang
   sudah basi dibanding perubahan terbaru admin di perangkat lain.
   Supaya ini tidak mengendap lama (dan berisiko balik menimpa data
   terbaru -- lihat catatan If-Match di syncToServer), kita muat
   ulang data dari server: (1) setiap kali tab ini menjadi aktif
   kembali (mis. pengguna beralih dari HP balik ke laptop), dan
   (2) secara berkala tiap 30 detik selagi tab ini aktif dilihat.
   loadFromServer() sendiri sudah aman dipanggil berulang -- ia
   melewati render() kalau ada modal/form yang sedang aktif diisi.
   ============================================================ */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') loadFromServer();
  else flushPendingSaveIfNeeded(); // tab disembunyikan/dipindah -- amankan dulu perubahan yang belum sempat tersinkron
});
window.addEventListener('focus', ()=>{
  if(document.visibilityState === 'visible') loadFromServer();
});
// Jaring pengaman terakhir: tab/browser benar-benar ditutup atau dinavigasi keluar
// dari halaman ini. 'pagehide' lebih dapat diandalkan daripada 'beforeunload' di
// banyak browser HP modern (termasuk saat masuk ke bfcache), jadi keduanya dipasang.
window.addEventListener('pagehide', flushPendingSaveIfNeeded);
window.addEventListener('beforeunload', flushPendingSaveIfNeeded);
setInterval(()=>{
  if(document.visibilityState === 'visible') loadFromServer();
}, 10000);
</script>
