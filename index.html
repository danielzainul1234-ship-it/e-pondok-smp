<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0f2942">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>E-Pondok SMP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f6faf7; --surface:#ffffff; --surface-alt:#eef4f0; --surface-raised:#ffffff;
  --border:#dde6e0; --border-strong:#c7d4cc;
  --text-primary:#152520; --text-secondary:#57685e; --text-muted:#8a978e;
  --emerald-50:#e7f6ee; --emerald-100:#c9ecdc; --emerald-200:#9fdcc0;
  --emerald-500:#10b981; --emerald-600:#059669; --emerald-700:#047857; --emerald-800:#065f46;
  --navy:#0f2942; --navy-2:#173a5c; --navy-ink:#0b1f33;
  --gold:#c9a227; --gold-dark:#a3811d; --gold-soft:#f4e9c8;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --info:#2563eb;
  --shadow-sm:0 1px 2px rgba(15,41,32,.07),0 1px 1px rgba(15,41,32,.04);
  --shadow-md:0 8px 24px -4px rgba(15,41,32,.12),0 2px 8px rgba(15,41,32,.06);
  --shadow-lg:0 20px 48px -12px rgba(15,41,32,.22);
  --radius-lg:18px; --radius:14px; --radius-sm:10px; --radius-xs:7px;
  --font: 'Plus Jakarta Sans', 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  --sidebar-w: 268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1512; --surface:#12201a; --surface-alt:#17271f; --surface-raised:#18281f;
    --border:#233a2f; --border-strong:#2d4a3b;
    --text-primary:#eef6f1; --text-secondary:#aac0b3; --text-muted:#748b7d;
    --emerald-50:#12291e; --emerald-100:#153a29; --emerald-200:#1c5038;
    --emerald-500:#34d399; --emerald-600:#22c55e; --emerald-700:#16a34a; --emerald-800:#0f7a44;
    --navy:#16324e; --navy-2:#1e4266; --navy-ink:#0b1f33;
    --gold:#e0c368; --gold-dark:#c9a227; --gold-soft:#3a331a;
    --info:#60a5fa;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 24px -4px rgba(0,0,0,.45);
    --shadow-lg:0 20px 48px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1512; --surface:#12201a; --surface-alt:#17271f; --surface-raised:#18281f;
  --border:#233a2f; --border-strong:#2d4a3b;
  --text-primary:#eef6f1; --text-secondary:#aac0b3; --text-muted:#748b7d;
  --emerald-50:#12291e; --emerald-100:#153a29; --emerald-200:#1c5038;
  --emerald-500:#34d399; --emerald-600:#22c55e; --emerald-700:#16a34a; --emerald-800:#0f7a44;
  --navy:#16324e; --navy-2:#1e4266; --navy-ink:#0b1f33;
  --gold:#e0c368; --gold-dark:#c9a227; --gold-soft:#3a331a;
  --info:#60a5fa;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 24px -4px rgba(0,0,0,.45);
  --shadow-lg:0 20px 48px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{max-width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-weight:700;text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--emerald-200);}
.hidden{display:none!important;}
img{max-width:100%;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Login ===== */
#loginScreen{min-height:100vh;display:flex;align-items:stretch;background:var(--bg);}
.login-visual{flex:1.1;position:relative;background:
  radial-gradient(circle at 20% 15%, rgba(201,162,39,.18), transparent 45%),
  radial-gradient(circle at 80% 85%, rgba(16,185,129,.25), transparent 50%),
  linear-gradient(155deg, var(--navy-ink) 0%, var(--navy) 55%, var(--emerald-800) 130%);
  display:flex;flex-direction:column;justify-content:space-between;padding:52px;color:#fff;overflow:hidden;}
.login-visual .pattern{position:absolute;inset:0;opacity:.12;background-image:
  repeating-conic-gradient(from 45deg, transparent 0 90deg, #fff 90deg 90.6deg);
  background-size:38px 38px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);}
.login-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.login-brand .brand-name{font-size:22px;font-weight:800;letter-spacing:.2px;}
.login-brand .brand-sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px;}
.login-hero{position:relative;z-index:1;max-width:440px;}
.login-hero h2{font-size:32px;line-height:1.25;color:#fff;font-weight:800;}
.login-hero p{margin-top:14px;color:rgba(255,255,255,.78);font-size:15px;line-height:1.6;}
.login-stats{position:relative;z-index:1;display:flex;gap:28px;}
.login-stats div b{display:block;font-size:24px;font-weight:800;color:var(--gold);}
.login-stats div span{font-size:12px;color:rgba(255,255,255,.7);}
.login-form-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
.login-card{width:100%;max-width:400px;}
.login-card .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.login-card h1{font-size:24px;}
.login-card .muted-title{color:var(--text-secondary);font-size:14px;margin-top:4px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.input-wrap{position:relative;}
.input, select.input, textarea.input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:14.5px;transition:border-color .15s;}
.input:focus{outline:none;border-color:var(--emerald-500);box-shadow:0 0 0 3px var(--emerald-100);}
.input-wrap .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-muted);font-size:16px;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-secondary);}
.link-btn{background:none;border:none;color:var(--emerald-700);font-weight:600;font-size:13.5px;cursor:pointer;padding:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;border:1.5px solid transparent;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--emerald-600);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--emerald-700);}
.btn-block{width:100%;}
.btn-outline{background:var(--surface);border-color:var(--border-strong);color:var(--text-primary);}
.btn-outline:hover{border-color:var(--emerald-500);color:var(--emerald-700);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-gold{background:var(--gold);color:#3a2f0a;}
.btn-danger{background:var(--critical);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:var(--radius-xs);}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-secondary);}
.btn-icon:hover{color:var(--emerald-700);border-color:var(--emerald-500);}
.demo-accounts{margin-top:22px;padding-top:18px;border-top:1px dashed var(--border);}
.demo-accounts .demo-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.demo-chip{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px;text-align:left;cursor:pointer;font-size:12px;}
.demo-chip b{display:block;font-size:12.5px;color:var(--text-primary);}
.demo-chip span{color:var(--text-muted);}
.demo-chip:hover{border-color:var(--emerald-500);background:var(--emerald-50);}
.login-error{background:#fdecec;border:1px solid #f3b9b9;color:#8a1f1f;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
:root[data-theme="dark"] .login-error, @media (prefers-color-scheme:dark){.login-error{background:#3a1616;border-color:#5c2323;color:#f3b9b9;}}

/* ===== App shell ===== */
#appShell{display:flex;min-height:100vh;}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:linear-gradient(180deg,var(--navy-ink),var(--navy));color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .25s;}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.09);}
.sb-brand .logo-box{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.sb-brand .logo-box img{width:100%;height:100%;object-fit:contain;}
.sb-brand .nm{font-size:15px;font-weight:800;color:#fff;line-height:1.2;}
.sb-brand .sb{font-size:10.5px;color:rgba(255,255,255,.55);}
#sidebarNav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-group{margin-bottom:2px;}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;position:relative;}
.nav-link .ic{width:19px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-link.active{background:var(--emerald-600);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.35);}
.nav-link .chev{margin-left:auto;font-size:11px;transition:transform .15s;opacity:.6;}
.nav-link.open .chev{transform:rotate(90deg);}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .2s ease;}
.nav-sub.open{max-height:400px;}
.nav-sub-link{padding:8px 12px 8px 45px;font-size:12.8px;color:rgba(255,255,255,.6);cursor:pointer;border-radius:8px;font-weight:600;}
.nav-sub-link:hover{color:#fff;background:rgba(255,255,255,.06);}
.nav-sub-link.active{color:var(--gold);}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);}
.sb-user{display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--emerald-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.sb-user .n{font-size:12.8px;font-weight:700;color:#fff;}
.sb-user .r{font-size:10.5px;color:rgba(255,255,255,.55);text-transform:capitalize;}
.logout-link{margin-top:10px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.6);font-size:12.8px;font-weight:600;cursor:pointer;padding:8px 4px;}
.logout-link:hover{color:#fff;}

#main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 26px;display:flex;align-items:center;gap:16px;}
#menuToggle{display:none;}
.search-wrap{flex:1;min-width:0;max-width:420px;position:relative;}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-alt);font-size:13.5px;color:var(--text-primary);}
.search-wrap input:focus{outline:none;border-color:var(--emerald-500);background:var(--surface);}
.search-wrap .sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:360px;overflow:auto;z-index:50;}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--surface-alt);}
.sr-item .t{font-size:13px;font-weight:700;}
.sr-item .d{font-size:11.5px;color:var(--text-muted);}
.sr-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--emerald-600);padding:8px 14px 2px;}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.bell-wrap{position:relative;}
.bell-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--critical);border:2px solid var(--surface);}
.dropdown-panel{position:absolute;right:0;top:calc(100% + 10px);width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;}
.dropdown-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;cursor:pointer;}
.notif-item:hover{background:var(--surface-alt);}
.notif-item .ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.notif-item .t{font-size:12.8px;font-weight:700;}
.notif-item .d{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.notif-item .tm{font-size:10.5px;color:var(--text-muted);margin-top:4px;}
.profile-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 8px 5px 5px;border-radius:12px;border:1px solid var(--border);background:var(--surface);}
.profile-btn:hover{border-color:var(--emerald-500);}
.profile-menu-item{padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text-secondary);}
.profile-menu-item:hover{background:var(--surface-alt);color:var(--text-primary);}

#content{padding:26px;max-width:1400px;width:100%;margin:0 auto;flex:1;}
.breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:22px;}
.page-head .sub{color:var(--text-secondary);font-size:13.5px;margin-top:4px;}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* Cards & stats */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.stat-card .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat-card .lbl{font-size:12.5px;color:var(--text-secondary);font-weight:600;}
.stat-card .delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;}
.delta.up{background:var(--emerald-50);color:var(--emerald-700);}
.section-title{font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:between;gap:8px;margin-bottom:2px;}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-good{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good);}
.pill-warn{background:color-mix(in srgb, var(--warning) 20%, transparent);color:#8a5a00;}
.pill-crit{background:color-mix(in srgb, var(--critical) 14%, transparent);color:var(--critical);}
.pill-info{background:color-mix(in srgb, var(--info) 14%, transparent);color:var(--info);}
.pill-muted{background:var(--surface-alt);color:var(--text-muted);}
.pill-gold{background:var(--gold-soft);color:var(--gold-dark);}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{text-align:left;padding:12px 16px;background:var(--surface-alt);color:var(--text-secondary);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--border);}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text-primary);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-alt);}
.td-actions{display:flex;gap:6px;}
.name-cell{display:flex;align-items:center;gap:10px;}
.name-cell .mini-avatar{width:34px;height:34px;border-radius:9px;background:var(--emerald-50);color:var(--emerald-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.name-cell .nm{font-weight:700;font-size:13px;}
.name-cell .sub{font-size:11.5px;color:var(--text-muted);}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.table-toolbar .search-wrap{max-width:260px;flex:1;}
.select-filter{padding:9px 30px 9px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%2357685e"/></svg>') no-repeat right 12px center;font-size:12.8px;color:var(--text-primary);appearance:none;font-weight:600;}
.tag-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--emerald-50);color:var(--emerald-700);}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:var(--text-muted);}

/* Progress */
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
.progress-row .lbl{width:82px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--text-secondary);}
.progress-row .lbl.lbl-wide{width:200px;}
.progress-track{flex:1;height:9px;border-radius:20px;background:var(--surface-alt);overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--emerald-500),var(--emerald-700));}
.progress-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-dark));}
.progress-pct{width:38px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,20,16,.5);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:modalIn .18s ease;margin:auto;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid .full{grid-column:1/-1;}
.form-section-lbl{grid-column:1/-1;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--emerald-700);margin-top:6px;padding-top:10px;border-top:1px dashed var(--border);}
.form-grid .form-section-lbl:first-child{border-top:none;margin-top:0;padding-top:0;}
.confirm-modal .modal-body{text-align:center;padding:26px 22px;}
.confirm-ic{width:56px;height:56px;border-radius:16px;background:#fdecec;color:var(--critical);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}

/* Toast */
#toastHost{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--navy-ink);color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .2s ease;min-width:240px;}
.toast.ok{border-left:4px solid var(--emerald-500);}
.toast.err{border-left:4px solid var(--critical);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Org chart */
.orgchart{display:flex;flex-direction:column;align-items:center;gap:0;padding:20px 0;overflow-x:auto;}
.org-node{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 18px;text-align:center;box-shadow:var(--shadow-sm);min-width:170px;position:relative;}
.org-node.top{background:linear-gradient(135deg,var(--navy),var(--emerald-700));color:#fff;border:none;}
.org-node .jbt{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-weight:800;}
.org-node.top .jbt{color:var(--gold);}
.org-node .nmm{font-size:13.5px;font-weight:800;margin-top:3px;}
.org-node:not(.top) .jbt{color:var(--emerald-700);}
.org-connector{width:2px;height:22px;background:var(--border-strong);}
.org-row{display:flex;gap:26px;position:relative;padding-top:22px;}
.org-row::before{content:'';position:absolute;top:0;left:50%;height:22px;width:2px;background:var(--border-strong);}
.org-row.multi::after{content:'';position:absolute;top:22px;left:calc(50% / var(--n,2));right:calc(50% / var(--n,2));height:2px;background:var(--border-strong);}
.divisi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding-top:22px;position:relative;width:100%;}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-dow{background:var(--surface-alt);padding:9px;text-align:center;font-size:11px;font-weight:800;color:var(--text-secondary);text-transform:uppercase;}
.cal-cell{background:var(--surface);min-height:96px;padding:7px;position:relative;min-width:0;overflow:hidden;}
.cal-cell.other-month{background:var(--surface-alt);opacity:.5;}
.cal-cell .dnum{font-size:12px;font-weight:700;color:var(--text-secondary);}
.cal-cell.today .dnum{background:var(--emerald-600);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-evt{margin-top:4px;font-size:10px;padding:3px 6px;border-radius:6px;background:var(--emerald-50);color:var(--emerald-700);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{padding:11px 16px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--emerald-700);border-color:var(--emerald-600);}
.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;}
.view-toggle button{padding:8px 14px;font-size:12.5px;font-weight:700;background:var(--surface);color:var(--text-secondary);border:none;cursor:pointer;}
.view-toggle button.active{background:var(--emerald-600);color:#fff;}

/* Report / print cards */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.report-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:.15s;}
.report-card:hover{border-color:var(--emerald-500);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.report-card .ic{width:44px;height:44px;border-radius:12px;background:var(--emerald-50);color:var(--emerald-700);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:12px;}
.report-card h4{font-size:14px;}
.report-card p{font-size:12px;color:var(--text-muted);margin-top:4px;}
.report-card-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:2;}
.report-card-actions button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.report-card-actions button:hover{border-color:var(--emerald-500);color:var(--emerald-700);}
.report-card-add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-style:dashed;color:var(--text-muted);font-weight:700;font-size:13px;min-height:110px;}
.report-card-add:hover{color:var(--emerald-700);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}

/* Print */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;}
  .no-print{display:none!important;}
}
.print-header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--emerald-600);padding-bottom:14px;margin-bottom:18px;}
.print-header img{width:52px;height:52px;object-fit:contain;}
.print-header h2{font-size:18px;}
.print-header p{font-size:12px;color:#555;}
.print-table table{width:100%;border-collapse:collapse;font-size:11.5px;}
.print-table th,.print-table td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
.print-table th{background:#f0f0f0;}

/* Card kartu santri */
.kartu-santri{width:340px;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-md);}
.kartu-santri .kh{background:linear-gradient(135deg,var(--emerald-700),var(--navy));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.kartu-santri .kh img{width:30px;height:30px;object-fit:contain;}
.kartu-santri .kh .t1{font-size:12px;font-weight:800;}
.kartu-santri .kh .t2{font-size:9.5px;opacity:.8;}
.kartu-santri .kb{padding:16px;display:flex;gap:14px;background:var(--surface);}
.kartu-santri .kfoto{width:74px;height:90px;border-radius:8px;background:var(--emerald-50);color:var(--emerald-700);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex-shrink:0;}
.kartu-santri .kd .nm{font-size:15px;font-weight:800;}
.kartu-santri .kd .rw{font-size:11.5px;color:var(--text-secondary);margin-top:5px;}
.kartu-santri .kf{padding:10px 16px;background:var(--surface-alt);font-size:10px;color:var(--text-muted);text-align:center;}

/* Responsive */
@media (max-width:1100px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media (max-width:880px){
  #sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #menuToggle{display:flex;flex-shrink:0;}
  .search-wrap{max-width:none;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  #content{padding:16px;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;}
  .sidebar-overlay.show{display:block;}
  #topbar{padding:10px 14px;gap:10px;}
  .bell-wrap, .profile-btn{flex-shrink:0;}
}
@media (max-width:560px){
  .login-visual{display:none;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .demo-grid{grid-template-columns:1fr;}
  .page-head{flex-direction:column;}
  .kartu-santri{width:100%;}
}

/* ===== Mobile-friendly enhancements ===== */
@media (max-width:640px){
  /* Prevent iOS Safari auto-zoom on focus (inputs need >=16px font-size) */
  .input, select.input, textarea.input, .search-wrap input{font-size:16px;}
  .select-filter{font-size:14px;}
  /* Touch targets */
  .btn-icon{width:40px;height:40px;}
  .btn{min-height:42px;}
  .btn-sm{min-height:36px;}
  /* Topbar: hide name/role text, keep avatar + chevron to save space */
  .pb-info{display:none;}
  .profile-btn{padding:5px;}
  /* Dropdown panels (notifikasi/profil) are anchored to a small icon inside the
     topbar, not the screen edge — on a narrow phone that puts a 340px panel
     partly off-screen. Pin them to the viewport instead so they always fit. */
  .dropdown-panel{position:fixed!important;top:60px;left:12px;right:12px;width:auto;max-width:none;}
  #profilePanel{left:auto!important;width:min(220px, calc(100vw - 24px))!important;}
  /* Modal: tighter padding on small screens */
  .modal-backdrop{padding:16px 10px;align-items:flex-start;}
  .modal-head{padding:14px 16px;}
  .modal-head h3{font-size:15px;}
  .modal-body{padding:16px;max-height:75vh;}
  .modal-foot{padding:12px 16px;flex-wrap:wrap;}
  .modal-foot .btn{flex:1;}
  /* Cards & content */
  #content{padding:14px;}
  .card-pad{padding:16px;}
  .page-head h1{font-size:19px;}
  /* Toasts: full-width friendly on phones */
  #toastHost{left:12px;right:12px;bottom:16px;}
  .toast{min-width:0;width:100%;}
  /* Progress rows with a wide fixed label (e.g. Safinah bab names) */
  .progress-row{flex-wrap:wrap;gap:8px;}
  .progress-row .lbl.lbl-wide{width:100%;}
  /* Org chart & calendar: shrink to fit narrow screens */
  .org-node{min-width:130px;padding:10px 12px;}
  .cal-cell{min-height:64px;padding:4px;}
  .cal-evt{font-size:9px;padding:2px 4px;}
  .cal-dow{padding:6px 2px;font-size:9.5px;}
}
@media (max-width:420px){
  .stat-grid{grid-template-columns:1fr;}
  .demo-grid{grid-template-columns:1fr;}
  #content{padding:12px;}
  .page-actions{width:100%;}
  .page-actions .btn{flex:1;}
  .table-toolbar{flex-direction:column;align-items:stretch;}
  .table-toolbar .search-wrap{max-width:none;}
}

/* ============================================================
   PUBLIC WEBSITE (pre-login marketing / info site)
   ============================================================ */
#publicRoot{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.pub-header{position:sticky;top:0;z-index:80;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s, box-shadow .2s;}
.pub-header.scrolled{border-color:var(--border);box-shadow:var(--shadow-sm);}
.pub-header-inner{max-width:1280px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:26px;}
.pub-brand{display:flex;align-items:center;gap:11px;cursor:pointer;margin-right:auto;}
.pub-brand .logo-box{width:42px;height:42px;border-radius:11px;background:var(--emerald-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.pub-brand .logo-box img{width:100%;height:100%;object-fit:contain;}
.pub-brand .t1{font-size:15.5px;font-weight:800;line-height:1.15;letter-spacing:-.1px;}
.pub-brand .t2{font-size:10.8px;color:var(--text-muted);font-weight:600;}
.pub-nav{display:flex;align-items:center;gap:4px;}
.pub-nav .pn-link{padding:9px 13px;border-radius:9px;font-size:13.3px;font-weight:700;color:var(--text-secondary);cursor:pointer;white-space:nowrap;}
.pub-nav .pn-link:hover{color:var(--emerald-700);background:var(--emerald-50);}
.pub-nav .pn-link.active{color:var(--emerald-700);background:var(--emerald-50);}
.pub-header-right{display:flex;align-items:center;gap:8px;}
.pub-search-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0;}
.pub-search-btn:hover{border-color:var(--emerald-500);color:var(--emerald-700);}
.pub-hamburger{display:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;}
#pubMobileNav{position:fixed;inset:0;z-index:95;display:none;}
#pubMobileNav.open{display:block;}
.pmn-overlay{position:absolute;inset:0;background:rgba(11,20,16,.45);}
.pmn-panel{position:absolute;top:0;right:0;bottom:0;width:82%;max-width:320px;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding:18px;animation:pmnIn .2s ease;}
@keyframes pmnIn{from{transform:translateX(16px);opacity:.6;}to{transform:none;opacity:1;}}
.pmn-close{align-self:flex-end;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:16px;cursor:pointer;color:var(--text-secondary);}
.pmn-panel .pn-link{display:block;padding:13px 6px;font-size:15px;font-weight:700;color:var(--text-primary);border-bottom:1px solid var(--border);cursor:pointer;}
.pmn-panel .pn-link.active{color:var(--emerald-700);}

.pub-search-panel{position:fixed;top:76px;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:120;display:none;overflow:hidden;}
.pub-search-panel.open{display:block;}
.pub-search-panel .psi{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.pub-search-panel .psi input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--text-primary);}
.pub-search-panel .psr{max-height:360px;overflow-y:auto;}
.pub-search-overlay{position:fixed;inset:0;z-index:110;display:none;}
.pub-search-overlay.open{display:block;}

.pub-hero{position:relative;overflow:hidden;background:
  radial-gradient(circle at 15% 10%, rgba(201,162,39,.16), transparent 45%),
  radial-gradient(circle at 85% 90%, rgba(16,185,129,.22), transparent 50%),
  linear-gradient(155deg, var(--navy-ink) 0%, var(--navy) 55%, var(--emerald-800) 130%);
  color:#fff;}
.pub-hero .pattern{position:absolute;inset:0;opacity:.1;background-image:repeating-conic-gradient(from 45deg, transparent 0 90deg, #fff 90deg 90.6deg);background-size:36px 36px;mask-image:radial-gradient(circle at 70% 30%, #000 0%, transparent 65%);}
.pub-hero-inner{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:76px 26px 64px;display:grid;grid-template-columns:1.15fr 0.85fr;gap:44px;align-items:center;}
.pub-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);}
.pub-eyebrow::before{content:'';width:22px;height:2px;background:var(--gold);display:inline-block;}
.pub-hero h1{font-size:clamp(28px,4vw,44px);line-height:1.18;margin-top:14px;color:#fff;letter-spacing:-.3px;}
.pub-hero p.lead{margin-top:16px;font-size:15.5px;line-height:1.7;color:rgba(255,255,255,.8);max-width:52ch;}
.pub-hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
.pub-hero-visual{position:relative;aspect-ratio:1/1;max-width:340px;margin:0 auto;}
.pub-hero-visual .arch{position:absolute;inset:0;background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));border-radius:50% 50% 14% 14%/60% 60% 8% 8%;border:1px solid rgba(255,255,255,.22);}
.pub-hero-visual .star{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58%;height:58%;}
.pub-hero-visual .arc{position:absolute;left:16%;right:16%;bottom:16%;height:14%;border-top:5px solid var(--gold);border-radius:50%/100% 100% 0 0;opacity:.85;}

.pub-section{max-width:1280px;margin:0 auto;padding:64px 26px;}
.pub-section.tight{padding-top:44px;padding-bottom:44px;}
.pub-section-head{margin-bottom:32px;max-width:640px;}
.pub-section-head .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--emerald-700);display:flex;align-items:center;gap:8px;}
.pub-section-head .eyebrow::before{content:'';width:22px;height:2px;background:var(--emerald-600);display:inline-block;}
.pub-section-head h2{font-size:clamp(22px,3vw,30px);margin-top:10px;letter-spacing:-.2px;}
.pub-section-head p{margin-top:10px;color:var(--text-secondary);font-size:14.5px;line-height:1.65;}
.pub-section-alt{background:var(--surface-alt);}

.pub-counter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-56px;position:relative;z-index:2;padding:0 26px;max-width:1280px;margin-left:auto;margin-right:auto;}
.pub-counter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 20px;box-shadow:var(--shadow-md);text-align:center;}
.pub-counter-card .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--emerald-700);line-height:1.1;}
.pub-counter-card .l{font-size:12.3px;color:var(--text-secondary);font-weight:700;margin-top:6px;}

.pub-profil-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;}
.pub-profil-visual{aspect-ratio:4/3;border-radius:var(--radius-lg);background:linear-gradient(150deg,var(--emerald-700),var(--navy));position:relative;overflow:hidden;box-shadow:var(--shadow-md);}
.pub-profil-visual .pattern{position:absolute;inset:0;opacity:.14;background-image:repeating-conic-gradient(from 45deg, transparent 0 90deg, #fff 90deg 90.6deg);background-size:30px 30px;}
.pub-profil-visual .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;color:rgba(255,255,255,.9);}
.pub-value-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
.pub-value-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;text-align:center;}
.pub-value-card .ic{font-size:22px;}
.pub-value-card .l{font-size:12.3px;font-weight:700;margin-top:8px;}
.pub-misi-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
.pub-misi-item{display:flex;gap:12px;align-items:flex-start;font-size:13.8px;color:var(--text-secondary);line-height:1.55;}
.pub-misi-item .num{width:24px;height:24px;border-radius:7px;background:var(--emerald-50);color:var(--emerald-700);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

.pub-card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.pub-info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;}
.pub-info-card:hover{border-color:var(--emerald-500);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.pub-info-card .kicker{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.pub-info-card h4{font-size:15px;line-height:1.35;}
.pub-info-card p{font-size:12.8px;color:var(--text-secondary);margin-top:8px;line-height:1.55;}
.pub-info-card .meta{margin-top:12px;font-size:11.5px;color:var(--text-muted);font-weight:600;}

.pub-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px;}
.pub-notice{display:flex;gap:14px;align-items:flex-start;background:var(--gold-soft);border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);border-radius:var(--radius);padding:16px 18px;margin-top:24px;}
.pub-notice .ic{font-size:20px;flex-shrink:0;}
.pub-notice .t{font-size:13.5px;color:var(--text-primary);font-weight:600;line-height:1.55;}
.pub-notice .t b{color:var(--gold-dark);}

.pub-footer{background:linear-gradient(180deg,var(--navy-ink),#081410);color:rgba(255,255,255,.66);margin-top:auto;}
.pub-footer-inner{max-width:1280px;margin:0 auto;padding:56px 26px 26px;}
.pub-footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:36px;padding-bottom:40px;}
.pub-footer-brand{display:flex;align-items:center;gap:12px;}
.pub-footer-brand .logo-box{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.pub-footer-brand .logo-box img{width:100%;height:100%;object-fit:contain;}
.pub-footer-brand .t1{color:#fff;font-weight:800;font-size:15px;}

function resizeImageToDataUrl(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => reject(new Error('Gagal memuat gambar'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Hafalan Al-Qur'an: progress per santri (juz 1-30) — deterministic pseudo-random */
function seedProgress(seed, n, base){
  const arr=[]; let x=seed;
  for(let i=1;i<=n;i++){
    x = (x*9301+49297) % 233280;
    const r = x/233280;
    let v = Math.max(0, Math.round(base - i*(base/(n*1.15)) + (r-0.5)*22));
    v = Math.min(100, Math.max(0, v));
    arr.push({ n:i, persen:v });
  }
  return arr;
}
DB.santri.forEach((s,i)=>{
  s.quranProgress = seedProgress(i*7+13, 30, 92 - (i%4)*8);
  s.safinahBab = [...SAFINAH_BAB_DEFAULT];
  s.safinahProgress = seedProgress(i*11+5, SAFINAH_BAB_DEFAULT.length, 88 - (i%3)*10);
});

/* ============================================================
   PENYIMPANAN & SINKRONISASI DATA
   Semua perubahan yang dibuat Admin/Pengurus/Ustadz (Pengaturan,
   Data Santri, Struktur Pengurus, Kegiatan, Hafalan, Absensi,
   Pengumuman) disimpan ke SERVER (lewat /api/data) sehingga data
   yang sama muncul di semua perangkat -- HP Android/iOS maupun
   laptop/MacBook -- bukan cuma di browser tempat perubahan dibuat.
   localStorage tetap dipakai sebagai cache lokal supaya halaman
   langsung tampil cepat saat dibuka, lalu disegarkan dengan data
   terbaru dari server begitu berhasil dimuat.
   Catatan: ini "last write wins" per seluruh data -- kalau dua
   perangkat menyimpan perubahan dalam waktu yang sangat berdekatan,
   perubahan yang tersimpan paling akhir yang dipakai.
   ============================================================ */
const STORAGE_KEY = 'epondokSmpDataV1';
const SYNC_API_URL = '/api/data';
let storageQuotaWarned = false;
let serverSyncFailWarned = false;
let lastSyncedJSON = null;
let isApplyingRemoteData = false;
let hadLocalCacheOnBoot = false;
// PENTING -- arsitektur sinkronisasi (diperbaiki total supaya tidak ada lagi data yang
// hilang saat mengisi banyak data dengan cepat berturut-turut):
// Versi lama menunda pengiriman lewat "debounce" (menunggu admin berhenti mengetik
// sejenak) yang lalu ditambal jadi "throttle" (paksa kirim tiap 1.5 detik). Keduanya
// tetap punya jendela waktu di mana data terbaru BELUM terkirim -- kalau tab ditutup
// tepat di jendela itu, data itu hilang untuk selamanya. Ini kemungkinan besar
// penyebab laporan "isi 5 data, yang tersimpan cuma 2".
//
// Solusi yang benar: TIDAK ADA lagi penundaan buatan sama sekali. Setiap perubahan
// nyata langsung dicoba dikirim ke server SAAT ITU JUGA. Satu-satunya alasan
// permintaan sebelumnya perlu ditunda adalah supaya dua permintaan tidak pernah
// berjalan BERSAMAAN (kalau dua permintaan tumpang tindih, permintaan yang lebih
// BARU bisa saja selesai duluan lalu permintaan yang lebih LAMA menyusul dan
// menimpanya dengan data basi). Jadi antriannya sederhana: kalau sedang ada
// permintaan berjalan, perubahan berikutnya cukup dicatat di `pendingSyncJSON`
// dan OTOMATIS dikirim (dengan data TERBARU, bukan data yang sudah using) begitu
// permintaan yang sedang berjalan selesai -- lihat doSyncNow().
let syncInFlight = false;
let pendingSyncJSON = null;
// Revisi data server yang terakhir kali diketahui perangkat ini (dari header
// ETag saat GET/POST /api/data berhasil). Dikirim balik sebagai If-Match saat
// menyimpan supaya server bisa mendeteksi kalau perangkat LAIN sudah menyimpan
// perubahan yang lebih baru sejak kita terakhir memuat data -- lihat
// syncToServer() untuk penanganan konfliknya.
let serverRevision = null;

function collectSyncPayload(){
  return {
    settings: STATE.settings,
    santri: DB.santri,
    pengurus: DB.pengurus,
    kegiatan: DB.kegiatan,
    setoranQuran: DB.setoranQuran,
    setoranSafinah: DB.setoranSafinah,
    setoranWirid: DB.setoranWirid,
    absensi: DB.absensi,
    pengumuman: DB.pengumuman,
    notifikasi: DB.notifikasi,
    kelasList: DB.kelasList,
    kamarList: DB.kamarList
  };
}

/* Data lama (sebelum daftar Bab Safinah diperbarui) menyimpan safinahBab versi lama
   pada tiap santri. Samakan ke daftar Bab terbaru supaya label & jumlah bab konsisten
   di semua perangkat. Progres per-bab lama tidak bisa dipetakan 1:1 ke daftar baru
   (isinya benar-benar berbeda), jadi progresnya direset ke 0% -- riwayat setoran yang
   sudah tercatat di menu Setoran Safinah TETAP AMAN dan tidak diubah/dihapus. */
function normalizeSafinahBab(){
  const canonical = JSON.stringify(SAFINAH_BAB_DEFAULT);
  DB.santri.forEach(s=>{
    if(!Array.isArray(s.safinahBab) || JSON.stringify(s.safinahBab) !== canonical){
      s.safinahBab = [...SAFINAH_BAB_DEFAULT];
      s.safinahProgress = SAFINAH_BAB_DEFAULT.map((_,i)=>({n:i+1, persen:0}));
    }
  });
}

function applySyncPayload(data){
  if(!data || typeof data !== 'object') return;
  if(data.settings && typeof data.settings === 'object') Object.assign(STATE.settings, data.settings);
  if(Array.isArray(data.santri)) DB.santri = data.santri;
  if(Array.isArray(data.pengurus)) DB.pengurus = data.pengurus;
  if(Array.isArray(data.kegiatan)) DB.kegiatan = data.kegiatan;
  if(Array.isArray(data.setoranQuran)) DB.setoranQuran = data.setoranQuran;
  if(Array.isArray(data.setoranSafinah)) DB.setoranSafinah = data.setoranSafinah;
  if(Array.isArray(data.setoranWirid)) DB.setoranWirid = data.setoranWirid;
  if(Array.isArray(data.absensi)) DB.absensi = data.absensi;
  if(Array.isArray(data.pengumuman)) DB.pengumuman = data.pengumuman;
  if(Array.isArray(data.notifikasi)) DB.notifikasi = data.notifikasi;
  if(Array.isArray(data.kelasList)) DB.kelasList = data.kelasList;
  if(Array.isArray(data.kamarList)) DB.kamarList = data.kamarList;
  normalizeSafinahBab();
}

function saveToStorage(){
  if(isApplyingRemoteData) return; // jangan kirim balik data yang baru saja dimuat dari server
  let json;
  try{
    const payload = collectSyncPayload();
    json = JSON.stringify(payload);
    localStorage.setItem(STORAGE_KEY, json);
    storageQuotaWarned = false;
  }catch(e){
    console.warn('Gagal menyimpan data lokal:', e);
    // Penyimpanan browser penuh (biasanya gara-gara gambar/logo terlalu besar) -- beri tahu
    // admin sekali saja per sesi supaya jelas kenapa perubahan tidak muncul di situs publik,
    // alih-alih gagal diam-diam.
    if(!storageQuotaWarned && typeof toast === 'function'){
      storageQuotaWarned = true;
      toast('Penyimpanan browser penuh, sebagian perubahan (mis. logo) mungkin tidak tersimpan. Coba gunakan gambar berukuran lebih kecil.', 'err');
    }
  }
  // Sinkronkan ke server supaya perangkat lain (HP/laptop) melihat data yang sama.
  // Tidak ada penundaan sama sekali -- lihat catatan besar di atas dekat deklarasi
  // syncInFlight/pendingSyncJSON untuk alasannya.
  if(json && json !== lastSyncedJSON){
    if(syncInFlight){
      // Ada permintaan lain yang masih dalam perjalanan ke server -- jangan kirim
      // bersamaan. Simpan data TERBARU ini; begitu permintaan yang sedang berjalan
      // selesai, doSyncNow() otomatis mengirim data terbaru ini juga.
      pendingSyncJSON = json;
    } else {
      doSyncNow(json);
    }
  }
}

function doSyncNow(json){
  syncInFlight = true;
  pendingSyncJSON = null;
  syncToServer(json, ()=>{
    syncInFlight = false;
    // Selama request di atas berjalan, mungkin ada perubahan BARU lagi yang masuk
    // (mis. admin lanjut mengisi santri berikutnya) -- kirim itu sekarang juga,
    // jangan tunggu apa-apa lagi.
    if(pendingSyncJSON && pendingSyncJSON !== lastSyncedJSON){
      const next = pendingSyncJSON;
      pendingSyncJSON = null;
      doSyncNow(next);
    }
  });
}

// Jaring pengaman TAMBAHAN (bukan yang utama lagi -- lihat catatan besar di dekat
// deklarasi syncInFlight/pendingSyncJSON untuk perbaikan utamanya): begitu
// tab/halaman akan ditinggalkan atau disembunyikan (pindah tab, kunci layar HP,
// tutup tab/browser) SEMENTARA masih ada request yang sedang berjalan (jadi belum
// sempat dikirim oleh doSyncNow), coba PAKSA kirim SAAT ITU JUGA lewat
// navigator.sendBeacon. Catatan jujur: sendBeacon (dan fetch keepalive) punya
// batas ukuran body ~64KB di Chromium, sedangkan data aplikasi ini bisa jauh lebih
// besar dari itu (pernah terukur ~100KB) -- jadi ini TIDAK bisa diandalkan sebagai
// satu-satunya jaring pengaman, hanya lapisan tambahan kalau kebetulan berhasil.
function flushPendingSaveIfNeeded(){
  try{
    const json = JSON.stringify(collectSyncPayload());
    if(!json || json === lastSyncedJSON) return; // tidak ada perubahan yang belum tersimpan
    let bodyStr = json;
    try{
      const parsed = JSON.parse(json);
      if(serverRevision) parsed._rev = serverRevision;
      bodyStr = JSON.stringify(parsed);
    }catch(e){ /* kirim apa adanya kalau parse gagal */ }
    let sent = false;
    if(typeof navigator !== 'undefined' && navigator.sendBeacon){
      try{ sent = navigator.sendBeacon(SYNC_API_URL, new Blob([bodyStr], {type:'application/json'})); }catch(e){ sent = false; }
    }
    if(!sent && typeof fetch === 'function'){
      // Fallback untuk browser lama yang tidak dukung sendBeacon -- keepalive:true
      // membuat fetch ini tetap diusahakan terkirim walau halaman sedang unload.
      try{ fetch(SYNC_API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:bodyStr, keepalive:true, cache:'no-store' }); }catch(e){}
    }
    // Anggap terkirim (optimis) -- ini permintaan searah tanpa bisa membaca respons
    // (termasuk kemungkinan konflik 409), jadi kalau memang gagal/konflik, siklus
    // penyegaran normal (loadFromServer saat halaman dibuka lagi) akan meluruskannya.
    lastSyncedJSON = json;
  }catch(e){ console.warn('Gagal flush data sebelum halaman ditutup:', e); }
}

function syncToServer(json, onDone){
  if(typeof fetch !== 'function'){ if(onDone) onDone(); return; }
  lastSyncedJSON = json;
  // Titipkan revisi terakhir yang kita ketahui sebagai field `_rev` DI DALAM
  // body JSON (bukan header HTTP) -- lihat catatan di server.js: header
  // ETag/If-Match ternyata tidak selalu sampai ke browser secara konsisten
  // di balik proxy/edge hosting, sedangkan body JSON selalu utuh sampai tujuan.
  let bodyToSend = json;
  try{
    const parsed = JSON.parse(json);
    if(serverRevision) parsed._rev = serverRevision;
    bodyToSend = JSON.stringify(parsed);
  }catch(e){ /* biarkan bodyToSend = json apa adanya kalau parse gagal */ }
  fetch(SYNC_API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: bodyToSend, cache:'no-store' })
    .then(res=>res.json().catch(()=>({})).then(responseData=>({status:res.status, responseData})))
    .then(({status, responseData})=>{
      if(status === 409){
        // Perangkat LAIN sudah menyimpan perubahan lebih baru sejak kita
        // terakhir memuat data -- JANGAN anggap ini tersinkron (supaya kita
        // tidak diam-diam kehilangan data), muat ulang data terbaru dari
        // server, dan beri tahu pengguna secara terbuka apa yang terjadi
        // (alih-alih perubahan mereka hilang tanpa penjelasan).
        lastSyncedJSON = null;
        if(typeof toast === 'function'){
          toast('Ada pembaruan data terbaru dari perangkat lain. Perubahan Anda barusan belum tersimpan -- data telah dimuat ulang, silakan simpan kembali perubahan Anda.', 'err');
        }
        return loadFromServer();
      }
      if(status < 200 || status >= 300) throw new Error('HTTP '+status);
      if(responseData && responseData._rev) serverRevision = responseData._rev;
      serverSyncFailWarned = false;
    })
    .catch(err=>{
      console.warn('Gagal menyinkronkan data ke server:', err);
      if(!serverSyncFailWarned && typeof toast === 'function'){
        serverSyncFailWarned = true;
        toast('Gagal menyinkronkan data ke server. Periksa koneksi internet Anda -- perubahan tersimpan sementara di perangkat ini saja.', 'err');
      }
    })
    .finally(()=>{ if(onDone) onDone(); });
}

function loadFromStorage(){
  // Muat cache lokal dulu supaya halaman langsung tampil (tidak menunggu jaringan).
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      hadLocalCacheOnBoot = true;
      const data = JSON.parse(raw);
      applySyncPayload(data);
    }
  }catch(e){ console.warn('Gagal memuat data lokal:', e); }
  // Tandai baseline ini supaya render() pertama (dipicu navigasi/boot biasa) TIDAK
  // langsung mengirim ulang data yang sama ke server -- hanya perubahan nyata yang dikirim.
  try{ lastSyncedJSON = JSON.stringify(collectSyncPayload()); }catch(e){ lastSyncedJSON = null; }
}

function loadFromServer(){
  if(typeof fetch !== 'function') return Promise.resolve();
  return fetch(SYNC_API_URL, { cache:'no-store' }).then(res=>{
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(data=>{
    if(data && typeof data === 'object' && data._rev) serverRevision = data._rev;
    if(data && typeof data === 'object' && Object.keys(data).length){
      // Server sudah punya data bersama -- pakai itu sebagai sumber kebenaran di semua perangkat.
      // Jangan menimpa form/modal yang sedang aktif diisi pengguna (mis. saat
      // ini terpicu oleh penyegaran otomatis di latar belakang, bukan saat boot),
      // dan jangan menimpa perubahan lokal yang BELUM sempat tersinkron ke server
      // (masih dalam antrean debounce/permintaan jaringan) -- kalau tidak, revisi
      // yang kita muat di sini sudah cukup untuk permintaan simpan kita berikutnya
      // (lihat If-Match di syncToServer), jadi aman untuk cukup berhenti di sini.
      const hasPendingLocalChange = (()=>{ try{ return JSON.stringify(collectSyncPayload()) !== lastSyncedJSON; }catch(e){ return false; } })();
      if(document.getElementById('activeModal') || hasPendingLocalChange){
        return;
      }
      isApplyingRemoteData = true;
      applySyncPayload(data);
      const json = JSON.stringify(collectSyncPayload());
      try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
      lastSyncedJSON = json;
      isApplyingRemoteData = false;
      render();
    } else if(hadLocalCacheOnBoot){
      // Server belum punya data sama sekali, TAPI perangkat ini sudah pernah
      // menyimpan data secara lokal sebelum fitur sinkron ini ada -- kirim data
      // itu sekali supaya jadi data bersama, tanpa menunggu admin klik Simpan lagi.
      // (Perangkat yang baru pertama kali dibuka dan belum punya cache lokal TIDAK
      // memicu ini, supaya tidak diam-diam menimpa data server dengan nilai bawaan.)
      syncToServer(JSON.stringify(collectSyncPayload()));
    }
  }).catch(err=>{
    console.warn('Gagal memuat data terbaru dari server (memakai data lokal untuk sementara):', err);
  });
}

function menuAllowed(item){ return !item.roles || item.roles.includes(STATE.currentUser.role); }
function filteredMenu(){
  return MENU.filter(menuAllowed).map(item=>{

    return {...item, children};
  }).filter(item=> !item.children || item.children.length>0);
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err'?'err':'ok');
  el.innerHTML = `<span>${type==='err'?'&#9888;':'&#10003;'}</span><span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ============================================================
   AUTH
   ============================================================ */
function doLogin(username, password){
  const u = USERS.find(x=>x.username.toLowerCase()===String(username).toLowerCase() && x.password===password);
  if(!u){ return false; }
  closeModal();
  STATE.currentUser = u;
  STATE.route = u.role==='santri' ? 'profil-saya' : 'dashboard';
  render();
  // Setiap kali ada yang login, segarkan dulu dengan data TERBARU dari server --
  // supaya begitu masuk, siapa pun (admin, ustadz, atau santri) langsung melihat
  // data paling baru yang dikelola admin, bukan cache lama perangkat ini yang
  // mungkin sudah beberapa saat tidak disegarkan (mis. tab yang dibiarkan
  // terbuka di layar login/beranda cukup lama sebelum akhirnya login).
  loadFromServer();
  return true;
}
function doLogout(){
  closeModal();
  STATE.currentUser = null;
  STATE.route = 'beranda';
  render();
}

/* ============================================================
   ROUTER / RENDER ROOT
   ============================================================ */
function navigate(route, params){
  closeModal();
  STATE.route = route;
  STATE.routeParams = params || {};
  STATE.sidebarOpen = false;
  STATE.openDropdown = null;
  render();
  const c = document.getElementById('content');
  if(c) c.scrollTop = 0;
  window.scrollTo(0,0);
}

function render(){
  saveToStorage();
  const app = document.getElementById('app');
  if(!STATE.currentUser){
    if(STATE.route === 'login'){
      app.innerHTML = renderLogin();
      bindLogin();
    } else {
      app.innerHTML = renderPublicSite();
      bindPublicSite();
    }
    return;
  }
  app.innerHTML = renderShell();
  bindShell();
}

function bindPublicChrome(){
  const header = document.getElementById('pubHeader');
  if(header){
    const onScroll = ()=>{ if(window.scrollY>8) header.classList.add('scrolled'); else header.classList.remove('scrolled'); };
    onScroll();
    window.addEventListener('scroll', onScroll, {passive:true});
  }
  const hb = document.getElementById('pubHamburgerBtn'); if(hb) hb.addEventListener('click', ()=>document.getElementById('pubMobileNav').classList.add('open'));
  const pmnClose = document.getElementById('pmnClose'); if(pmnClose) pmnClose.addEventListener('click', ()=>document.getElementById('pubMobileNav').classList.remove('open'));
  const pmnOverlay = document.getElementById('pmnOverlay'); if(pmnOverlay) pmnOverlay.addEventListener('click', ()=>document.getElementById('pubMobileNav').classList.remove('open'));

  const searchBtn = document.getElementById('pubSearchBtn');
  const panel = document.getElementById('pubSearchPanel');
  const overlay = document.getElementById('pubSearchOverlay');
  const input = document.getElementById('pubSearchInput');
  function openSearch(){ panel.classList.add('open'); overlay.classList.add('open'); input.value=''; document.getElementById('pubSearchResults').innerHTML=''; input.focus(); }
  function closeSearch(){ panel.classList.remove('open'); overlay.classList.remove('open'); }
  if(searchBtn) searchBtn.addEventListener('click', e=>{ e.stopPropagation(); openSearch(); });
  if(overlay) overlay.addEventListener('click', closeSearch);
  if(input){
    input.addEventListener('click', e=>e.stopPropagation());
    input.addEventListener('input', e=>{
      const q = e.target.value.trim().toLowerCase();
      const box = document.getElementById('pubSearchResults');
      if(!q){ box.innerHTML=''; return; }
      const res = publicSearchIndex(q);
      if(res.length===0){ box.innerHTML = `<div class="sr-item" style="color:var(--text-muted);">Tidak ditemukan hasil untuk "${esc(q)}"</div>`; return; }
      let cur='';
      box.innerHTML = res.map((r,idx)=>{ let h=''; if(r.cat!==cur){ h+=`<div class="sr-cat">${r.cat}</div>`; cur=r.cat; } h+=`<div class="sr-item" data-idx="${idx}"><div class="t">${esc(r.title)}</div><div class="d">${esc(r.desc)}</div></div>`; return h; }).join('');
      on('.sr-item[data-idx]','click', ev=>{ const idx=ev.currentTarget.dataset.idx; closeSearch(); res[idx].go(); }, box);
    });
  }
}
function publicSearchIndex(q){
  const res = [];
  DB.kegiatan.forEach(k=>{ if(k.nama.toLowerCase().includes(q)||k.kategori.toLowerCase().includes(q)) res.push({cat:'Kegiatan', title:k.nama, desc:`${k.kategori} • ${fmtDateShort(k.tanggal)}`, go:()=>navigate('kegiatan-publik')}); });
  DB.pengumuman.forEach(a=>{ if(a.judul.toLowerCase().includes(q)) res.push({cat:'Informasi', title:a.judul, desc:`${a.kategori} • ${fmtDateShort(a.tanggal)}`, go:()=>navigate('informasi-publik')}); });
  DB.pengurus.forEach(p=>{ if(p.status==='Aktif' && (p.nama.toLowerCase().includes(q)||p.jabatan.toLowerCase().includes(q))) res.push({cat:'Pengurus', title:p.nama, desc:p.jabatan, go:()=>navigate('struktur-publik')}); });
  return res.slice(0,8);
}

        <div class="pub-info-card" data-nav="kegiatan-publik"><div class="kicker"><span style="font-size:22px;">&#128197;</span></div><h4>Kegiatan Pondok</h4><p>Jadwal kegiatan harian dan mingguan — tahfidz, kajian, hingga kegiatan khusus.</p></div>
        <div class="pub-info-card" data-nav="hafalan-publik"><div class="kicker"><span style="font-size:22px;">&#128214;</span></div><h4>Program Hafalan</h4><p>Gambaran umum capaian hafalan Al-Qur'an, Safinah, dan Setoran Wirid seluruh santri.</p></div>
        <div class="pub-info-card" data-nav="santri-publik"><div class="kicker"><span style="font-size:22px;">&#128101;</span></div><h4>Data Santri</h4><p>Statistik jumlah santri berdasarkan kelas, kamar, dan jenis kelamin.</p></div>
        <div class="pub-info-card" data-nav="informasi-publik"><div class="kicker"><span style="font-size:22px;">&#128276;</span></div><h4>Informasi &amp; Pengumuman</h4><p>Pengumuman resmi dan berita terbaru dari pondok.</p></div>
        <div class="pub-info-card" data-nav="login"><div class="kicker"><span style="font-size:22px;">&#128274;</span></div><h4>Login Sistem</h4><p>Masuk sesuai peran: Admin, Pengurus, Ustadz/Ustadzah, atau Santri.</p></div>
      </div>
    </section>`;
  },
  bind(){
    $all('[data-count]').forEach(el=>{
      const target = parseInt(el.dataset.count,10)||0;
      const start = performance.now(); const dur = 900;
      function step(t){
        const p = Math.min(1,(t-start)/dur);
        el.textContent = Math.round(target*(1-Math.pow(1-p,3)));
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
};

const pubKegiatanState = { search:'', kategori:'', tanggal:'', viewMode:'daftar' };
function pubKegiatanFiltered(){
  return DB.kegiatan.filter(k=>{
    if(pubKegiatanState.search && !k.nama.toLowerCase().includes(pubKegiatanState.search.toLowerCase())) return false;
    if(pubKegiatanState.kategori && k.kategori!==pubKegiatanState.kategori) return false;
    if(pubKegiatanState.tanggal && k.tanggal!==pubKegiatanState.tanggal) return false;
    return true;
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
}
function renderPubKegiatanList(){
  const list = pubKegiatanFiltered();
  const activeFilter = pubKegiatanState.search || pubKegiatanState.kategori || pubKegiatanState.tanggal;
  return `

        <div class="pub-info-card" data-viewpk="${k.id}">
          <div class="kicker"><span class="tag-badge">${esc(k.kategori)}</span>${statusPill(k.status)}</div>
          <h4>${esc(k.nama)}</h4>
          <p>${esc(k.deskripsi)}</p>
          <div class="meta">&#128197; ${fmtDateShort(k.tanggal)} • ${k.jamMulai}-${k.jamSelesai} WIB<br>&#128205; ${esc(k.tempat)} • PJ: ${esc(k.pj)}</div>
        </div>`).join('') : `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">&#128197;</div>Tidak ada kegiatan yang sesuai filter.</div>`}
    </div>
  </section>`;
}
function renderPubKegiatanKalender(){
  const m = STATE.calMonth; const y=m.getFullYear(), mo=m.getMonth();
  const first=new Date(y,mo,1); const startOffset=first.getDay();
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const cells=[]; for(let i=0;i<startOffset;i++) cells.push(null); for(let d=1;d<=daysInMonth;d++) cells.push(d); while(cells.length%7!==0) cells.push(null);
  const monthLabel = m.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  return `
  <section class="pub-section tight">
    <div class="pub-section-head"><div class="eyebrow">Kegiatan</div><h2>Kalender Kegiatan Pondok</h2></div>
    <div class="pub-toolbar"><div class="view-toggle"><button class="${pubKegiatanState.viewMode==='daftar'?'active':''}" id="pkList">Daftar</button><button class="${pubKegiatanState.viewMode==='kalender'?'active':''}" id="pkCal">Kalender</button></div></div>
    <div class="card card-pad">
      <div class="row-between" style="margin-bottom:14px;">
        <button class="btn-icon" id="pkCalPrev">&#8592;</button>
        <h3 style="text-transform:capitalize;">${monthLabel}</h3>
        <button class="btn-icon" id="pkCalNext">&#8594;</button>
      </div>
      <div class="cal-grid">
        ${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return `<div class="cal-cell other-month"></div>`;
          const dateStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const evts = DB.kegiatan.filter(k=>k.tanggal===dateStr);
          const isToday = dateStr===todayStr();
          return `<div class="cal-cell ${isToday?'today':''}"><div class="dnum">${d}</div>${evts.slice(0,2).map(e=>`<div class="cal-evt" data-viewpk="${e.id}">${esc(e.nama)}</div>`).join('')}${evts.length>2?`<div style="font-size:9.5px;color:var(--text-muted);margin-top:2px;">+${evts.length-2} lainnya</div>`:''}</div>`;
        }).join('')}
      </div>
    </div>
  </section>`;
}

  const s=document.getElementById('pkSearch'); if(s) s.addEventListener('input', e=>{ pubKegiatanState.search=e.target.value; rerenderPublicContent(); });
  const k=document.getElementById('pkKategori'); if(k) k.addEventListener('change', e=>{ pubKegiatanState.kategori=e.target.value; rerenderPublicContent(); });
  const t=document.getElementById('pkTanggal'); if(t) t.addEventListener('change', e=>{ pubKegiatanState.tanggal=e.target.value; rerenderPublicContent(); });
  const r=document.getElementById('pkReset'); if(r) r.addEventListener('click', ()=>{ pubKegiatanState.search=''; pubKegiatanState.kategori=''; pubKegiatanState.tanggal=''; rerenderPublicContent(); });
  const pv=document.getElementById('pkCalPrev'); if(pv) pv.addEventListener('click', ()=>{ STATE.calMonth=new Date(STATE.calMonth.getFullYear(),STATE.calMonth.getMonth()-1,1); rerenderPublicContent(); });
  const nx=document.getElementById('pkCalNext'); if(nx) nx.addEventListener('click', ()=>{ STATE.calMonth=new Date(STATE.calMonth.getFullYear(),STATE.calMonth.getMonth()+1,1); rerenderPublicContent(); });
  on('[data-viewpk]','click', e=>{
    const k=DB.kegiatan.find(x=>x.id===e.currentTarget.dataset.viewpk); if(!k) return;
    openModal(`<div class="modal-head"><h3>${esc(k.nama)}</h3><button class="btn-icon" data-close-modal>&times;</button></div>
      <div class="modal-body">
        <p style="color:var(--text-secondary);font-size:13.8px;line-height:1.6;margin-bottom:16px;">${esc(k.deskripsi)}</p>
        <div class="form-grid">
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">KATEGORI</label><div style="margin-top:4px;">${esc(k.kategori)}</div></div>
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">TANGGAL</label><div style="margin-top:4px;">${fmtDate(k.tanggal)}</div></div>
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">WAKTU</label><div style="margin-top:4px;">${k.jamMulai}-${k.jamSelesai} WIB</div></div>
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">TEMPAT</label><div style="margin-top:4px;">${esc(k.tempat)}</div></div>
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">PENANGGUNG JAWAB</label><div style="margin-top:4px;">${esc(k.pj)}</div></div>
          <div><label style="font-size:11px;color:var(--text-muted);font-weight:700;">STATUS</label><div style="margin-top:4px;">${statusPill(k.status)}</div></div>
        </div>
      </div>`);
  });
}

/* ---------- PUBLIC: Hafalan (aggregate overview only) ---------- */
PUBLIC_VIEWS['hafalan-publik'] = {
  render(){
    const juzAvg = [];
    for(let j=1;j<=30;j++){
      const vals = DB.santri.map(x=>(x.quranProgress.find(p=>p.n===j)||{persen:0}).persen);
      juzAvg.push({n:j, persen: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)});
    }
    // Dibulatkan ke 1 angka desimal (bukan ke bilangan bulat) -- terutama untuk
    // Safinah yang punya 58 bab, rata-rata gabungan dari progres yang baru mulai
    // sedikit (mis. baru 1-2 santri yang disetorkan) bisa jatuh di bawah 0.5% dan
    // membulat jadi "0%" walau progres per-bab-nya sebenarnya sudah tercatat --
    // ini bisa terlihat seperti "data tidak update" padahal cuma pembulatan.
    const round1 = n => Math.round(n*10)/10;
    const overallQuran = round1(juzAvg.reduce((a,b)=>a+b.persen,0)/30);
    const babCount = SAFINAH_BAB_DEFAULT.length;
    const babAvg = [];
    for(let b=0;b<babCount;b++){
      const vals = DB.santri.map(x=>(x.safinahProgress.find(p=>p.n===b+1)||{persen:0}).persen);
      babAvg.push({n:b+1, persen: Math.round(vals.reduce((a,c)=>a+c,0)/vals.length)});
    }
    const overallSafinah = round1(babAvg.reduce((a,b)=>a+b.persen,0)/babCount);
    const totalWirid = DB.setoranWirid.length;
    const rataNilaiWirid = Math.round(DB.setoranWirid.reduce((a,x)=>a+x.nilai,0)/(totalWirid||1));
    const wiridByJenis = WIRID_JENIS.map((j,i)=>({label:j, value: DB.setoranWirid.filter(x=>x.jenis===j).length, color: ['var(--emerald-700)','var(--gold-dark)','var(--info)'][i%3]}));
    return `
    <section class="pub-section tight">
      <div class="pub-section-head">
        <div class="eyebrow">Hafalan</div>
        <h2>Program Hafalan Al-Qur'an, Safinah &amp; Setoran Wirid</h2>
        <p>Gambaran umum capaian hafalan dan setoran wirid seluruh santri. Detail per santri hanya dapat dilihat setelah login.</p>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card"><div class="top"><div class="stat-ic" style="background:var(--emerald-50);color:var(--emerald-700);">&#128214;</div></div><div class="val">${overallQuran}%</div><div class="lbl">Rata-rata Capaian Al-Qur'an (30 Juz)</div></div>
        <div class="stat-card"><div class="top"><div class="stat-ic" style="background:var(--gold-soft);color:var(--gold-dark);">&#128213;</div></div><div class="val">${overallSafinah}%</div><div class="lbl">Rata-rata Capaian Safinah (${babCount} Bab)</div></div>
        <div class="stat-card"><div class="top"><div class="stat-ic" style="background:var(--info-soft, #e6f0fb);color:var(--info,#2563eb);">&#128220;</div></div><div class="val">${totalWirid}</div><div class="lbl">Total Setoran Wirid (Rata-rata Nilai ${rataNilaiWirid})</div></div>
      </div>
      <div class="grid-2">
        <div class="card card-pad">
          <div class="section-title" style="margin-bottom:14px;">Rata-Rata Progres per Juz</div>
          ${svgBarChart(juzAvg.filter((_,i)=>i%3===0).map(j=>({label:'J'+j.n, value:j.persen, color:'var(--emerald-500)'})), {max:100})}
        </div>
        <div class="card card-pad">
          <div class="section-title" style="margin-bottom:14px;">Rata-Rata Progres Safinah per Bab</div>
          <div style="max-height:280px;overflow-y:auto;">
          ${babAvg.map(b=>`<div class="progress-row"><div class="lbl lbl-wide">${esc(SAFINAH_BAB_DEFAULT[b.n-1])}</div><div class="progress-track"><div class="progress-fill gold" style="width:${b.persen}%;"></div></div><div class="progress-pct">${b.persen}%</div></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:14px;">Distribusi Setoran Wirid per Jenis</div>
        ${totalWirid ? svgBarChart(wiridByJenis,{max:Math.max(...wiridByJenis.map(b=>b.value),5)}) : `<div class="empty-state" style="padding:20px;">Belum ada catatan setoran wirid.</div>`}
      </div>
      <div class="pub-notice">
        <div class="ic">&#128274;</div>
        <div class="t"><b>Ingin melihat progres hafalan &amp; wirid putra/putri Anda?</b> <span data-nav="login" style="text-decoration:underline;cursor:pointer;">Login</span> menggunakan akun Ustadz/Ustadzah atau Santri untuk mengakses detail per santri.</div>
      </div>
    </section>`;
  },
  bind(){}
};

function searchIndex(q){
  q = q.toLowerCase();
  if(!q) return [];
  const res = [];
  DB.santri.forEach(s=>{ if(s.nama.toLowerCase().includes(q)||s.nomorInduk.includes(q)||s.kelas.toLowerCase().includes(q)||s.kamar.toLowerCase().includes(q)) res.push({cat:'Santri', title:s.nama, desc:`${s.kelas} • ${s.nomorInduk}`, go:()=>navigate('santri-detail',{id:s.id})}); });
  DB.pengurus.forEach(p=>{ if(p.nama.toLowerCase().includes(q)||p.jabatan.toLowerCase().includes(q)) res.push({cat:'Pengurus', title:p.nama, desc:p.jabatan, go:()=>navigate('struktur-data')}); });
  DB.kegiatan.forEach(k=>{ if(k.nama.toLowerCase().includes(q)||k.kategori.toLowerCase().includes(q)) res.push({cat:'Kegiatan', title:k.nama, desc:`${k.kategori} • ${fmtDateShort(k.tanggal)}`, go:()=>navigate('kegiatan-daftar')}); });
  return res.slice(0,8);
}

  if(bellBtn) bellBtn.addEventListener('click', e=>{ e.stopPropagation(); const p=document.getElementById('notifPanel'); const wasHidden = p.classList.contains('hidden'); closeAllDropdowns(); if(wasHidden){ p.classList.remove('hidden'); DB.notifikasi.forEach(n=>n.dibaca=true); } });
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.addEventListener('click', e=>{ e.stopPropagation(); const p=document.getElementById('profilePanel'); const wasHidden = p.classList.contains('hidden'); closeAllDropdowns(); if(wasHidden) p.classList.remove('hidden'); });
  const themeBtn = document.getElementById('toggleThemeBtn');
  if(themeBtn) themeBtn.addEventListener('click', toggleTheme);
  on('.notif-item','click', e=>{ toast('Membuka detail notifikasi...'); closeAllDropdowns(); });

  const gs = document.getElementById('globalSearch');
  if(gs){
    gs.addEventListener('input', e=>{
      STATE.searchQuery = e.target.value;
      const res = searchIndex(STATE.searchQuery);
      const box = document.getElementById('searchResults');
      if(!STATE.searchQuery){ box.classList.add('hidden'); return; }
      if(res.length===0){ box.innerHTML = `<div class="sr-item" style="color:var(--text-muted);">Tidak ditemukan hasil untuk "${esc(STATE.searchQuery)}"</div>`; }
      else {
        let cur=''; box.innerHTML = res.map(r=>{ let h=''; if(r.cat!==cur){ h+=`<div class="sr-cat">${r.cat}</div>`; cur=r.cat; } h+=`<div class="sr-item" data-idx="${res.indexOf(r)}"><div class="t">${esc(r.title)}</div><div class="d">${esc(r.desc)}</div></div>`; return h; }).join('');

function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  if(cur === 'dark'){ root.setAttribute('data-theme','light'); }
  else if(cur === 'light'){ root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
  toast('Tampilan diperbarui.');
}
